<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Threes! Wheel</title>
<link rel="icon" type="image/svg+xml" href="icon-wheel.svg">
<!-- iOS ignores the manifest's icons for "Add to Home Screen" and wants a
     plain PNG here specifically - an SVG silently falls back to a screenshot. -->
<link rel="apple-touch-icon" href="apple-touch-icon-wheel.png">
<link rel="manifest" href="manifest-wheel.json">
<meta name="theme-color" content="#da3e3e">
<!-- Gets "Add to Home Screen" to launch with no Safari chrome (address bar/
     toolbar) - iOS has no real Fullscreen API, so this is the actual
     fullscreen path there; see attachFullscreenToggle in threes-common.js,
     which hides the in-page fullscreen button on iPhone for exactly this
     reason. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Threes! Wheel">
<link rel="stylesheet" href="threes-common.css">
<style>
  :root {
    --board-bg: #e8e8ea;
    --cell-bg: rgba(0,0,0,0.04);
    --cell-border: rgba(0,0,0,0.14);
  }
  /* A circular backdrop (rather than the other variants' rounded square) fits
     the "wheel" concept - it's what actually spins. layoutHex() squares up the
     board's footprint (the hex content itself is a bit taller than wide) so
     this comes out as a true circle instead of an ellipse. */
  #board {
    position: relative;
    background: var(--board-bg);
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  /* Flat-top hexagon with subtly rounded corners - the #hexRoundClip path below
     is the same rounded-hex shape used by the (pointy-top) hex variant, just
     transposed (x/y swapped), which for a shape this symmetric is exactly a
     90-degree rotation - i.e. flat-top instead of pointy-top. That's what
     makes the *overall* board (a hexagon of hexagons) come out vertex-down
     instead of flat-edge-down: individual flat-top cells, hexagon-of-cells
     vertex-down, is a 30-degree rotation of the original variant's pairing. */
  .hex-shape {
    clip-path: url(#hexRoundClip);
  }
  .cell-bg {
    position: absolute;
    width: 74px;
    height: 64px;
    background: var(--cell-bg);
    filter: drop-shadow(0 0 1px var(--cell-border));
  }
  /* Perf fork (wheel-only - see makeTileEl/animateMoveWheel in the script
     below for the full story): every tile is really two nested elements now.
     .tile-pos is the actual positioned box - transform-only, GPU-composited,
     never triggers layout the way left/top does - and the inner .tile keeps
     its existing look and its own scale/rotate keyframes (merge-pop,
     milestone-pop, wildcard flips), which still use `transform` too, just
     for scale/rotation rather than position. Splitting position onto a
     separate ancestor is what lets both live in `transform` at once without
     fighting over the property on one element. */
  .tile-pos {
    position: absolute;
    left: 0;
    top: 0;
  }
  .tile-pos > .tile {
    position: absolute;
    left: 0;
    top: 0;
    /* left/top themselves never change now (position lives on .tile-pos'
       transform instead) - narrowed from the shared .tile rule's transition
       (which still includes left/top, harmless but pointless here) down to
       just what can actually change on this element: opacity/transform for
       a loser's delayed fade-and-shrink, set directly (not via a class) in
       animateMoveWheel. */
    transition: opacity 0.08s ease, transform 0.08s ease;
  }
  .tile {
    width: 74px;
    height: 64px;
    border-radius: 0;
    font-size: 24px;
    border: none;
    box-shadow: none;
    /* One drop-shadow instead of the two stacked ones this used to have -
       drop-shadow is one of the more expensive CSS filters (unlike
       box-shadow, it rasterizes against the actual clipped hex alpha shape,
       not just the bounding box), and stacking two roughly doubled that cost
       per tile per frame - a real contributor to mobile lag during a
       many-tiles-animating cascade. */
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
  }
  .tile.wild {
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 0 6px rgba(212,175,55,0.6))
            drop-shadow(0 2px 3px rgba(0,0,0,0.25))
            drop-shadow(0 0 1px rgba(255,255,255,0.6));
  }
  .tile.bomb {
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 0 6px rgba(200,40,20,0.65))
            drop-shadow(0 2px 3px rgba(0,0,0,0.25))
            drop-shadow(0 0 1px rgba(255,255,255,0.5));
  }
  /* A detonated tile pops outward first, *holds* there for a beat (unlike a
     plain merge loser's quiet shrink-and-fade), and only then vanishes - so
     a whole rank clearing off the board reads as its own distinct moment
     the player can actually watch happen, not something that blends into
     the surrounding fall. */
  @keyframes bombExplode {
    0%   { transform: scale(1);    opacity: 1; }
    18%  { transform: scale(1.45); opacity: 1; }
    45%  { transform: scale(1.3);  opacity: 1; }
    70%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.1);  opacity: 0; }
  }
  .tile.bomb-explode { animation: bombExplode 0.6s ease-out forwards; z-index: 3; }
  /* A radial flash at each detonated tile's own position - tinted to that
     tile's own color (set inline per burst, see spawnColoredGlow), so the
     "same rank exploding away" reads as connected color pops across the
     board rather than one single effect. The bomb itself gets a distinct
     flash color instead of a rank tint. Otherwise identical to
     ThreesCommon's .milestone-glow. */
  @keyframes bombGlow {
    0%   { transform: scale(0.6); opacity: 0.95; }
    100% { transform: scale(2.3); opacity: 0; }
  }
  .bomb-glow {
    position: absolute;
    border-radius: 50%;
    animation: bombGlow 0.6s ease-out;
    pointer-events: none;
    z-index: 4;
  }

  /* Two big rotate buttons sit just outside the board's flat left/right edges
     (siblings of #board, positioned in JS from the board's current pixel size,
     same pattern the hex variant uses for its edge bars) - "spin the wheel"
     left or right, rather than sliding tiles in any of 6 directions. */
  #rotate-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
  }
  .rotate-btn {
    position: absolute;
    padding: 0;
    border: 1px solid rgba(0,0,0,0.16);
    border-radius: 999px;
    background: #f4a340;
    color: #2f4858;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    cursor: pointer;
    pointer-events: auto;
  }
  .rotate-btn:active { background: #ffb75c; transform: scale(0.94); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="hexRoundClip" clipPathUnits="objectBoundingBox">
        <path d="M0.035,0.43 Q0,0.5 0.035,0.57 L0.215,0.93 Q0.25,1 0.32,1 L0.68,1 Q0.75,1 0.785,0.93 L0.965,0.57 Q1,0.5 0.965,0.43 L0.785,0.07 Q0.75,0 0.68,0 L0.32,0 Q0.25,0 0.215,0.07 Z"/>
      </clipPath>
    </defs>
  </svg>
  <div id="app">
    <div id="header">
      <div id="brand">
        <button id="brand-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
          <img src="icon-wheel.svg" width="40" height="40" alt="">
        </button>
        <span>Threes! Wheel</span>
        <div id="variant-menu">
          <a href="index.html">&larr; Classic square game</a>
          <a href="threes-hex.html">&larr; Hex variant</a>
        </div>
      </div>
      <div id="next-tile-box">
        Next
        <div id="next-indicator"></div>
      </div>
      <div id="header-actions">
        <button class="icon-btn" id="fullscreen-btn" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
        <button class="game-btn" id="restart-btn">Restart</button>
      </div>
    </div>
    <div id="score-row">
      <div id="score-label">Score</div>
      <div id="score-value">0</div>
    </div>
    <div id="main">
      <div id="board-wrap">
        <div id="board"></div>
        <div id="rotate-controls">
          <button class="rotate-btn" id="rotate-ccw" aria-label="Rotate counterclockwise">&#8634;</button>
          <button class="rotate-btn" id="rotate-cw" aria-label="Rotate clockwise">&#8635;</button>
        </div>
        <div id="overlay" class="hidden">
          <div id="overlay-text">Game Over</div>
          <button class="game-btn" id="overlay-restart">Try Again</button>
        </div>
      </div>
    </div>
  </div>

<script src="threes-common.js"></script>
<script>
(function () {
  const {
    WILD, canMerge, mergeValue, partnerValue, pickRandom, cellKey, parseKey,
    currentMaxValue, scoreForValue, triplesContaining,
    paintTile, paintNumeral, miniFontSize, tileColor, updatePageBackground,
    attachFullscreenToggle, attachDropdownMenu,
  } = ThreesCommon;

  const RADIUS = 2;
  const BASE_HEX_SIZE = 42;   // circumradius used for cell-to-cell spacing (the "pitch")
  const BASE_HEX_RENDER = 37; // circumradius actually drawn; smaller than the pitch so a
                              // gap shows on all 6 sides, matching the other variants' look
  const BASE_BOARD_PAD = Math.sqrt(3) * (BASE_HEX_SIZE - BASE_HEX_RENDER);
  let SCALE = 1, HEX_SIZE = BASE_HEX_SIZE, HEX_RENDER = BASE_HEX_RENDER, BOARD_PAD = BASE_BOARD_PAD;
  // Flat-top cells: vertex-to-vertex (width) is 2*render, flat-to-flat (height) is
  // sqrt(3)*render - the transpose of the pointy-top variant's HEX_W/HEX_H.
  let HEX_W = HEX_RENDER * 2;
  let HEX_H = HEX_RENDER * Math.sqrt(3);
  // Three distinct, deliberately-paced stages rather than one blur: (1) rotate
  // the wheel - snappy, since it's directly driven by the button/key/swipe;
  // (2) a small beat of stillness so the eye registers "the spin is done";
  // (3) gravity - slowed way down from the other variants' snap-into-place
  // speed, so tiles visibly travel and merge, not teleport, before finally
  // (4) the new tile appears (that one stays quick - it's just arriving, not
  // traveling far). Stage 2's travel is a CSS transition on each tile's
  // .tile-pos wrapper `transform` (see the CSS comment above .tile-pos), with
  // the duration set inline (setTilePosTransition below) instead of relying
  // on one shared speed. Stage 1 (rotation) *can't* use a CSS transition at all -
  // see the tweenArc/rotatePoint comment below for why - so it's driven by a
  // small requestAnimationFrame loop instead.
  const ROTATE_MS = 160;      // stage 1: full button/keyboard rotation
  const ROTATE_PAUSE_MS = 40; // gap between stage 1 settling and stage 2 starting
  const FALL_MS = 280;         // stage 2: gravity's travel time
  const WINNER_FLIP_MS = 220;  // stage 2: a merge winner's pop/flip, once it lands
  const LOSER_FLIP_MS = FALL_MS + 60; // comfortable margin past the delayed fade's own completion
  const WILDCARD_CHANCE = 0.05;
  // A bomb detonates whatever rank it lands on/next to - see canMergeWheel,
  // findBombDetonation, and resolveBombDetonations below - rather than
  // merging into a new value the way every other tile (including the
  // wildcard) does.
  const BOMB = 'B';
  const BOMB_CHANCE = 0.1;
  const BOMB_POP_MS = 600;   // detonation: explode, hold, then vanish - its own distinct beat
  const BOMB_PAUSE_MS = 180; // stillness after the pop, before gravity closes the gaps - echoes ROTATE_PAUSE_MS's role between stages
  const TRIPLE_HINT_CHANCE = 0.6;
  const STARTER_FILL_RATIO = 0.4;

  // Four legal moves now, not two: CW or CCW, and 60 or 120 degrees. Touch
  // reaches the second stop by dragging further past the first (see
  // DRAG_EASE_RANGE_2 below); button/keyboard reaches it by holding the
  // press down past LONG_PRESS_MS before releasing, rather than a quick
  // tap-and-release (see activeMove/onPressEnd/finalizeMove below move()).
  //
  // Touch swipe drives stage 1 directly, live, instead of jumping straight to
  // the button/keyboard's instant turn: rotation tracks the actual angle
  // swept by the finger around the board's center (see the pointermove handler
  // below). Releasing commits to whichever stop (60 or 120) is closest to the
  // current progress, as long as there's still *any* net progress in the
  // chosen direction (past the deadzone) - a tiny flick is enough, on
  // purpose, rather than requiring the drag to cross some fraction of the way
  // there. Only a real backtrack - dragging past the start point, back
  // toward/beyond zero, before releasing - cancels it entirely.
  const DRAG_ANGLE_DEADZONE = 6;   // degrees of slop before a direction is even chosen
  // The live drag maps physical swipe angle to rotation through the *same*
  // easeOutCubic curve the button/keyboard tween uses (steepest right at the
  // start, flattening out), rather than a flat multiplier - a flat multiplier
  // still reads as hesitant because a real swipe's first ~50-100ms (a finger
  // overcoming its own inertia) is genuinely slow, so scaling it by a
  // constant just produces a smaller slow motion, not a *fast-feeling* one.
  // Feeding it through the same front-loaded curve the button already uses
  // is what actually makes the two feel alike: a small initial finger move
  // already produces a disproportionately large rotation, exactly like the
  // button's animation does in time instead of in physical distance.
  // DRAG_EASE_RANGE is the physical swipe angle (degrees) that reaches the
  // first (60-degree) stop. Past it, DRAG_EASE_RANGE_2 is the *additional*
  // physical swipe needed to reach the second (120-degree) stop - a plain
  // linear extension rather than another eased curve, since the point of the
  // easing was specifically to fix a swipe's slow *start*, which no longer
  // applies once the finger is already well into a fast, continuous drag.
  const DRAG_EASE_RANGE = 36;
  const DRAG_EASE_RANGE_2 = 40;
  const DRAG_SNAP_MS = 120;        // stage 1: finishing (or undoing) a released drag

  // A touch-capable device can already rotate the wheel by swiping, so the
  // buttons (mainly useful as a discoverable, precise click target for
  // mouse/keyboard use) just add clutter there - detect touch once up front
  // and skip reserving any room for them at all when it's present, same as
  // the hex variant does for its edge bars.
  const HAS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const BASE_BTN_SIZE = 52;
  const BASE_BTN_GAP = 8;
  // Sit in their own row under the board now, not beside it, so the board can
  // use nearly the full available width instead of losing a button's worth of
  // margin on both sides.
  const BASE_BOTTOM_CLEARANCE = HAS_TOUCH ? 0 : (BASE_BTN_SIZE + BASE_BTN_GAP);

  // --- Tile spawn distribution (tuned looser than the hex variant - see
  // maxSpawnValue/LOW_VALUE_BOOST/CHAIN_DECAY below for why) ----------------
  const SPAWN_CAP = 96;
  // Lower than the hex variant's 1.8/0.55: this variant's fall-and-cascade
  // gravity burns through 1s and 2s faster than a one-step slide does, so the
  // same weighting read as far more 1/2-heavy here - a flat 50/50 split
  // between 1 and 2 was already correct (verified by simulation), but 1+2
  // combined still dominated ~80% of draws even well into the midgame.
  const LOW_VALUE_BOOST = 1.3;
  const CHAIN_DECAY = 0.65;
  const STARTER_CAP = 6;

  function maxSpawnValue(matchValue) {
    // The hex variant gates variety behind matchValue >= 12 (i.e. behind
    // already having chained two merges: 1+2=3, 3+3=6, 6+6=12) - here that
    // left every spawn stuck at 1-or-2 for a long stretch of early play, since
    // nothing else could open the gate faster. Unlocking as soon as a 3
    // exists (matchValue >= 3) lets a 3 start appearing within the very first
    // few spawns instead. Math.max(3, ...) keeps the floor at the chain's
    // first rung rather than rounding down to nothing for matchValue 3-11.
    if (matchValue < 3) return 2;
    return Math.min(SPAWN_CAP, Math.max(3, matchValue / 4));
  }
  // 1 and 2 are two separate entries (equal weight each, summing to the same
  // LOW_VALUE_BOOST*2 total the old combined-then-coin-flipped slot had) so
  // an anti-streak exclusion (see recordSpawn/lastSpawnValue below) can drop
  // just one of them from consideration without touching the other.
  function pickSpawnValueForCap(cap, excludeValue) {
    const entries = [{ v: 1, w: LOW_VALUE_BOOST }, { v: 2, w: LOW_VALUE_BOOST }];
    for (let v = 3, i = 0; v <= cap; v *= 2, i++) entries.push({ v, w: Math.pow(CHAIN_DECAY, i + 1) });
    const pool = excludeValue == null ? entries : entries.filter(e => e.v !== excludeValue);
    const total = pool.reduce((sum, e) => sum + e.w, 0);
    let r = Math.random() * total;
    for (const e of pool) {
      r -= e.w;
      if (r < 0) return e.v;
    }
    return pool[pool.length - 1].v;
  }
  function pickSpawnValue(matchValue, excludeValue) {
    return pickSpawnValueForCap(maxSpawnValue(matchValue), excludeValue);
  }

  // No more than 3 consecutive spawns of the same value (the same rule the
  // player would want for any value, but it's most noticeable for 1 and 2,
  // which is most of what a spawn draws to begin with) - once a run hits 3,
  // that value is excluded from the *next* draw only, then eligible again.
  let lastSpawnValue = null;
  let lastSpawnStreak = 0;
  function recordSpawn(value) {
    if (value === lastSpawnValue) lastSpawnStreak++;
    else { lastSpawnValue = value; lastSpawnStreak = 1; }
  }

  const boardEl = document.getElementById('board');
  const scoreValueEl = document.getElementById('score-value');
  const nextIndicatorEl = document.getElementById('next-indicator');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlay-text');

  // --- Board geometry (axial coords q,r) - same 19-cell hexagon-of-hexagons
  // as the other hex variant. ---
  const ALL_CELLS = [];
  for (let q = -RADIUS; q <= RADIUS; q++) {
    const r1 = Math.max(-RADIUS, -q - RADIUS), r2 = Math.min(RADIUS, -q + RADIUS);
    for (let r = r1; r <= r2; r++) ALL_CELLS.push([q, r]);
  }
  const ALL_KEYS = ALL_CELLS.map(([q, r]) => cellKey(q, r));

  // Every "fall" line is one column (fixed q), ordered from the bottom cell
  // (largest r - the wall gravity pulls toward) to the top cell (smallest r -
  // the far edge, where new tiles spawn). Fall direction never changes, unlike
  // the swipe-any-of-6-ways hex variant, so this is built once.
  const FALL_LINES = [];
  {
    const byQ = new Map();
    for (const [q, r] of ALL_CELLS) {
      if (!byQ.has(q)) byQ.set(q, []);
      byQ.get(q).push(r);
    }
    for (const [q, rs] of byQ) {
      rs.sort((a, b) => b - a); // descending: index 0 = max r = bottom/wall
      FALL_LINES.push(rs.map(r => cellKey(q, r)));
    }
  }

  // Rotating the whole wheel by 60 degrees is a fixed relabeling of axial
  // coordinates (pure cube-coordinate rotation, so it's exact regardless of
  // pixel orientation): CW advances q,r -> -r, q+r; CCW is its inverse.
  function rotateCW(q, r) { return [-r, q + r]; }
  function rotateCCW(q, r) { return [q + r, -q]; }

  // Bomb never merges through the normal system - even against a wildcard,
  // which the shared canMerge would otherwise treat as "matches anything"
  // (a bomb-vs-wildcard pair would fall through to canMerge's own
  // WILD-completes-any-match branch and get merged into a nonsense value
  // like "BB" if this guard weren't here). It only ever resolves via
  // detonation - see findBombDetonation/resolveBombDetonations below - so it
  // just sits inert (a solid obstacle gravity packs around, same as any
  // other tile) as far as the ordinary merge cascade is concerned.
  function canMergeWheel(a, b) {
    if (a === BOMB || b === BOMB) return false;
    return canMerge(a, b);
  }

  // One slide-and-merge pass: collapses a line toward the wall, merging
  // equal/compatible tiles as they collide. A tile that resulted from a merge
  // this pass can't merge again until the *next* pass - that's what makes it
  // a single pass rather than a full cascade (collapseLineFull below runs
  // this repeatedly to get the cascade).
  function collapseOnePass(line) {
    const stack = [];
    const merges = [];
    for (const cell of line) {
      if (!cell) continue;
      const top = stack[stack.length - 1];
      if (top && !top.merged && canMergeWheel(top.value, cell.value)) {
        const newValue = mergeValue(top.value, cell.value);
        const winnerWasWild = top.value === WILD;
        const loserWasWild = cell.value === WILD;
        const revealValue = winnerWasWild ? partnerValue(cell.value)
                           : loserWasWild ? partnerValue(top.value)
                           : null;
        merges.push({ winnerId: top.id, loserId: cell.id, newValue, winnerWasWild, loserWasWild, revealValue });
        top.value = newValue;
        top.merged = true;
      } else {
        stack.push({ id: cell.id, value: cell.value, merged: false });
      }
    }
    const newLine = new Array(line.length).fill(null);
    for (let i = 0; i < stack.length; i++) newLine[i] = { id: stack[i].id, value: stack[i].value };
    return { merges, newLine };
  }

  // Collapses one line (array of {id,value}|null, index0 = wall/bottom side)
  // *all the way* toward the wall (2048-style full slide, rather than each
  // tile moving at most one slot as in the other two, Threes-style variants),
  // re-running the pass above until nothing more merges - so a merge that
  // lands next to another matching tile (e.g. 3+3=6 sliding up against an
  // existing 6) keeps cascading into 12, and so on, instead of stopping after
  // one round. A tile can end up as a winner in one pass and then a loser in
  // a later pass of the same cascade - see the nextOwner chain-resolution in
  // startFallPhase, which depends on that.
  function collapseLineFull(line) {
    let current = line;
    const allMerges = [];
    for (;;) {
      const { merges, newLine } = collapseOnePass(current);
      current = newLine;
      if (merges.length === 0) break;
      allMerges.push(...merges);
    }
    let moved = false;
    for (let i = 0; i < line.length; i++) {
      const before = line[i], after = current[i];
      if ((before ? before.id : null) !== (after ? after.id : null) ||
          (before ? before.value : null) !== (after ? after.value : null)) { moved = true; break; }
    }
    return { moved, merges: allMerges, newLine: current };
  }

  function resolveFall(grid, tileValue) {
    let anyMoved = false;
    const allMerges = [];
    const newEntries = [];
    for (const line of FALL_LINES) {
      const slots = line.map(key => {
        const id = grid.get(key);
        return id ? { id, value: tileValue[id] } : null;
      });
      const { moved, merges, newLine } = collapseLineFull(slots);
      if (moved) anyMoved = true;
      allMerges.push(...merges);
      line.forEach((key, i) => newEntries.push([key, newLine[i] ? newLine[i].id : null]));
    }
    return { anyMoved, allMerges, newEntries };
  }

  // A resting bomb detonates the instant it has any (numeric) neighbor in
  // its column. Gravity always packs a column with no gaps, so the very
  // first tile ever to land next to a bomb - whether that's the bomb itself
  // falling onto an existing heap, or something later falling into the
  // otherwise-empty column it was sitting alone in - is its *only* neighbor
  // at the moment this first becomes true; nothing can already be sandwiched
  // on its far side without having triggered this on an earlier turn. Only a
  // plain numeric neighbor counts - a wildcard or another bomb just sits
  // inertly beside it instead (the spec only ever describes numeric ranks,
  // and chaining bomb-vs-wildcard has no obvious defined outcome).
  function findBombDetonation(grid, tileValue) {
    for (const line of FALL_LINES) {
      const ids = line.map(key => grid.get(key)).filter(id => id != null);
      for (let i = 0; i < ids.length; i++) {
        if (tileValue[ids[i]] !== BOMB) continue;
        const before = ids[i - 1], after = ids[i + 1];
        if (before != null && typeof tileValue[before] === 'number') return { bombId: ids[i], rank: tileValue[before] };
        if (after != null && typeof tileValue[after] === 'number') return { bombId: ids[i], rank: tileValue[after] };
      }
    }
    return null;
  }

  // Removes a detonating bomb and every tile of the rank it matched, then
  // closes the resulting gaps by packing each column toward the wall - pure
  // gravity, no further merging (the spec describes tiles "readjusting and
  // falling", not cascading into new matches). Loops in case clearing a rank
  // exposes a different bomb to a new match - a rare chain, but cheap to
  // support once the single case is handled. Mutates grid/tileValue in
  // place; returns every removedId across the whole chain plus each
  // individual event (for scoring/animation - see startFallPhase).
  function resolveBombDetonations(grid, tileValue) {
    const removedIds = new Set();
    const events = [];
    for (;;) {
      const found = findBombDetonation(grid, tileValue);
      if (!found) break;
      const { bombId, rank } = found;
      const batch = [bombId];
      for (const id in tileValue) if (tileValue[id] === rank) batch.push(Number(id));
      for (const id of batch) { delete tileValue[id]; removedIds.add(id); }
      for (const line of FALL_LINES) {
        const ids = line.map(key => grid.get(key)).filter(id => id != null && !batch.includes(id));
        line.forEach((key, i) => {
          if (ids[i] != null) grid.set(key, ids[i]);
          else grid.delete(key);
        });
      }
      events.push({ bombId, rank });
    }
    return { removedIds, events };
  }

  // Each cell's pixel top-left (for a HEX_W x HEX_H box). Flat-top pixel
  // formula (transpose of the pointy-top one): x depends only on q (so a fixed
  // q is a true vertical column - what makes "fall straight down" meaningful
  // on a hex grid at all), y combines both.
  let CELL_PIXEL = {};
  let BOARD_W = 0, BOARD_H = 0;
  function layoutHex() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const centers = {};
    for (const [q, r] of ALL_CELLS) {
      const x = HEX_SIZE * 1.5 * q;
      const y = HEX_SIZE * Math.sqrt(3) * (r + q / 2);
      centers[cellKey(q, r)] = { x, y };
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const contentW = maxX - minX + HEX_W;
    const contentH = maxY - minY + HEX_H;
    // The hex-of-hexes content isn't naturally square (it's a bit taller than
    // wide), but the board backdrop is a circle now - square it up (whichever
    // axis is shorter gets extra centering room beyond the usual BOARD_PAD) so
    // border-radius: 50% comes out as a true circle, not an ellipse.
    const side = Math.max(contentW, contentH) + BOARD_PAD * 2;
    const offsetX = -minX + (side - contentW) / 2 + HEX_W / 2;
    const offsetY = -minY + (side - contentH) / 2 + HEX_H / 2;
    CELL_PIXEL = {};
    for (const key in centers) {
      CELL_PIXEL[key] = { left: centers[key].x + offsetX - HEX_W / 2, top: centers[key].y + offsetY - HEX_H / 2 };
    }
    BOARD_W = side;
    BOARD_H = side;
    boardEl.style.width = BOARD_W + 'px';
    boardEl.style.height = BOARD_H + 'px';
  }

  const boardWrapEl = document.getElementById('board-wrap');
  const rotateControlsEl = document.getElementById('rotate-controls');
  const rotateCcwBtn = document.getElementById('rotate-ccw');
  const rotateCwBtn = document.getElementById('rotate-cw');
  if (HAS_TOUCH) rotateControlsEl.style.display = 'none';

  // The two rotate buttons sit in a row centered under the board - the
  // wheel's only two "grips" for anyone without touch. Skipped entirely (no
  // work, no reserved space) when touch is available.
  function layoutRotateControls() {
    if (HAS_TOUCH) return;
    const size = BASE_BTN_SIZE * SCALE, gap = BASE_BTN_GAP * SCALE;
    rotateCcwBtn.style.width = rotateCcwBtn.style.height = size + 'px';
    rotateCwBtn.style.width = rotateCwBtn.style.height = size + 'px';
    rotateCcwBtn.style.fontSize = (size * 0.5) + 'px';
    rotateCwBtn.style.fontSize = (size * 0.5) + 'px';
    const rowTop = BOARD_H + gap;
    const totalWidth = size * 2 + gap;
    const leftX = BOARD_W / 2 - totalWidth / 2;
    rotateCcwBtn.style.left = leftX + 'px';
    rotateCcwBtn.style.top = rowTop + 'px';
    rotateCwBtn.style.left = (leftX + size + gap) + 'px';
    rotateCwBtn.style.top = rowTop + 'px';
  }

  // Mirrors layoutHex's squaring logic (at base/unscaled size) so computeScale
  // below is sizing against the board's actual (square, circular-backdrop)
  // footprint rather than the hex content's natural, slightly-taller-than-wide
  // bounding box.
  function measureNaturalBoardSide() {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [q, r] of ALL_CELLS) {
      const x = BASE_HEX_SIZE * 1.5 * q;
      const y = BASE_HEX_SIZE * Math.sqrt(3) * (r + q / 2);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const contentW = (maxX - minX) + BASE_HEX_RENDER * 2;
    const contentH = (maxY - minY) + BASE_HEX_RENDER * Math.sqrt(3);
    return Math.max(contentW, contentH) + BASE_BOARD_PAD * 2;
  }
  const NATURAL_BOARD_SIDE = measureNaturalBoardSide();
  const NATURAL_WIDTH = NATURAL_BOARD_SIDE;
  const NATURAL_HEIGHT = NATURAL_BOARD_SIDE + BASE_BOTTOM_CLEARANCE;
  const MAX_SCALE = 3;
  const appEl = document.getElementById('app');
  const headerEl = document.getElementById('header');
  const scoreRowEl = document.getElementById('score-row');
  const mainEl = document.getElementById('main');

  function computeScale() {
    const appStyle = getComputedStyle(appEl);
    const scoreRowStyle = getComputedStyle(scoreRowEl);
    const vPad = parseFloat(appStyle.paddingTop) + parseFloat(appStyle.paddingBottom);
    const appGap = parseFloat(appStyle.gap) || 16;
    const scoreRowMargin = parseFloat(scoreRowStyle.marginTop) + parseFloat(scoreRowStyle.marginBottom);
    const chromeHeight = headerEl.offsetHeight + scoreRowEl.offsetHeight + scoreRowMargin + vPad + appGap * 2;
    const availableWidth = window.innerWidth - 44;
    const availableHeight = window.innerHeight - chromeHeight;
    const widthScale = availableWidth / NATURAL_WIDTH;
    const heightScale = availableHeight / NATURAL_HEIGHT;
    return Math.max(0.4, Math.min(widthScale, heightScale, MAX_SCALE));
  }

  function applyBoardDimensions() {
    SCALE = computeScale();
    HEX_SIZE = BASE_HEX_SIZE * SCALE;
    HEX_RENDER = BASE_HEX_RENDER * SCALE;
    HEX_W = HEX_RENDER * 2;
    HEX_H = HEX_RENDER * Math.sqrt(3);
    BOARD_PAD = BASE_BOARD_PAD * SCALE;
    layoutHex();
    boardWrapEl.style.margin = `0 0 ${BASE_BOTTOM_CLEARANCE * SCALE}px 0`;
    layoutRotateControls();
  }

  function cellPos(q, r) {
    return CELL_PIXEL[cellKey(q, r)];
  }

  // Sets a tile's position-only transition duration for this fall (inline
  // styles win over the stylesheet, so each stage's travel can be timed
  // independently). Applies to the .tile-pos wrapper now, not the tile
  // itself - see makeTileEl/animateMoveWheel - since position lives entirely
  // in that wrapper's `transform`.
  function setTilePosTransition(wrap, ms) {
    wrap.style.transition = `transform ${ms}ms cubic-bezier(.32,.72,.35,1)`;
  }

  // animateMoveWheel sets a merge loser's position (sliding it the rest of
  // the way into the winner, on the wrapper) and its opacity/scale (the
  // fade-out, on the inner face) in the very same tick. At the other
  // variants' matched slide/fade speed that's invisible, but stage 2's slide
  // is now much longer than its 80ms fade default - fading out in 80ms while
  // still sliding for 280ms meant losers visually vanished well before
  // they'd traveled anywhere close to the winner, instead of appearing to
  // fall into it. Delaying the (still-quick) fade so it only plays during
  // the tail end of the slide - via transition-delay - makes it read as
  // "arrives, then gets absorbed" instead of "vanishes mid-air". The same
  // fix covers a wildcard loser's card-flip-reveal, which is a CSS
  // *animation* rather than a transition, via animation-delay instead.
  // Applies to the inner face, unlike setTilePosTransition above - the
  // wrapper's own position transition (set separately, on every tile) is
  // untouched by any of this.
  const LOSER_EFFECT_MS = 90;
  function setLoserFaceTransition(face, ms) {
    const delay = Math.max(0, ms - LOSER_EFFECT_MS);
    face.style.transition = `opacity ${LOSER_EFFECT_MS}ms ease ${delay}ms, transform ${LOSER_EFFECT_MS}ms ease ${delay}ms`;
    face.style.animationDelay = delay + 'ms';
  }

  // Stage 1 can't be a plain CSS transform transition the way stage 2 is: a
  // transition only interpolates *linearly* between the start and end
  // values, but two points on a circle joined by a straight line cut inside
  // the circle - every tile would visibly bunch in toward the center mid-turn
  // instead of sweeping around it. There's no CSS-only fix for that (no
  // curved-path transition exists), so stage 1 is driven by its own
  // requestAnimationFrame loop instead,
  // computing a true rotation (constant radius, changing angle) every frame.
  //
  // Rotates point (px,py) by `deg` degrees around (cx,cy). In screen
  // coordinates (y grows downward) a positive angle is clockwise - verified
  // against this file's rotateCW/rotateCCW axial math, which already
  // established that convention for the underlying grid.
  function rotatePoint(px, py, cx, cy, deg) {
    const rad = deg * Math.PI / 180;
    const dx = px - cx, dy = py - cy;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // Animates every tile in `startCenters` (Map<id, {cx,cy}> - each tile's
  // pixel *center* before this rotation) along the arc from fromDeg to toDeg
  // around the board's center, over durationMs, then calls onDone. Used for
  // the button/keyboard instant turn and for finishing (or undoing) a
  // released drag - anywhere stage 1 needs to *animate* rather than track a
  // live pointer 1:1.
  function tweenArc(startCenters, fromDeg, toDeg, durationMs, onDone) {
    const bcx = BOARD_W / 2, bcy = BOARD_H / 2;
    const items = [];
    for (const [id, { cx, cy }] of startCenters) {
      const el = elById.get(id);
      if (!el) continue;
      el.style.transition = 'none';
      items.push({ el, cx, cy });
    }
    const t0 = performance.now();
    function frame() {
      const raw = durationMs > 0 ? Math.min(1, (performance.now() - t0) / durationMs) : 1;
      const deg = fromDeg + (toDeg - fromDeg) * easeOutCubic(raw);
      for (const { el, cx, cy } of items) {
        const p = rotatePoint(cx, cy, bcx, bcy, deg);
        el.style.transform = `translate(${p.x - HEX_W / 2}px, ${p.y - HEX_H / 2}px)`;
      }
      if (raw < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }
    requestAnimationFrame(frame);
  }

  let grid;
  let tileValue;
  let tilePos;
  let elById;
  let idCounter;
  let nextValue;
  let recordMax;
  let highestMatchValue;
  let rotating = false;
  // At most one pending direction, captured from input that arrived while the
  // board was mid-animation (rotating). Fired the instant the board frees up,
  // so a fast double-swipe feels absorbed instead of silently dropped.
  let queuedMove = null;

  function drawStarterValue() {
    return pickSpawnValueForCap(STARTER_CAP);
  }
  function drawNextValue() {
    const blocked = lastSpawnStreak >= 3 ? lastSpawnValue : null;
    if (blocked !== WILD && Math.random() < WILDCARD_CHANCE) return WILD;
    if (blocked !== BOMB && Math.random() < BOMB_CHANCE) return BOMB;
    return pickSpawnValue(highestMatchValue, blocked);
  }

  function emptyKeys() {
    return ALL_KEYS.filter(k => !grid.get(k));
  }
  function placeRandomTile(value) {
    const cells = emptyKeys();
    if (!cells.length) return null;
    const key = pickRandom(cells);
    const [q, r] = parseKey(key);
    const id = idCounter++;
    grid.set(key, id);
    tileValue[id] = value;
    tilePos[id] = [q, r];
    return id;
  }

  // With only 4 possible moves (rotate CW or CCW, 60 or 120 degrees), the
  // generic "board full and no adjacent mergeable pair anywhere" check the
  // other variants use is too loose here: a full board can easily have a
  // mergeable pair sitting somewhere in the raw hex-adjacency sense that
  // these specific moves can *never* actually bring together (confirmed
  // empirically - alternating rotations can spin in place on a full board
  // indefinitely with zero merges, while that check kept reporting "not
  // over"). The real question is simpler and cheaper to answer directly:
  // does *this* rotation, followed by its fall, produce any merge at all? If
  // none of the 4 do, and the board is full, there is no move left that
  // changes anything.
  function wouldMergeIfRotated(dir, steps) {
    const rotateFn = dir === 'CW' ? rotateCW : rotateCCW;
    const testGrid = new Map();
    for (const [key, id] of grid) {
      let [q, r] = parseKey(key);
      for (let i = 0; i < steps; i++) [q, r] = rotateFn(q, r);
      testGrid.set(cellKey(q, r), id);
    }
    const fallResult = resolveFall(testGrid, tileValue);
    if (fallResult.allMerges.length > 0) return true;
    // A rotation that produces zero ordinary merges can still be the
    // productive move if it's what finally brings a resting bomb into
    // contact with a match - that's a real board change too, just not one
    // resolveFall itself knows how to find.
    const settledGrid = new Map(fallResult.newEntries.filter(([, id]) => id != null));
    return findBombDetonation(settledGrid, tileValue) != null;
  }
  function isWheelGameOver() {
    return emptyKeys().length === 0
      && !wouldMergeIfRotated('CW', 1) && !wouldMergeIfRotated('CW', 2)
      && !wouldMergeIfRotated('CCW', 1) && !wouldMergeIfRotated('CCW', 2);
  }

  function scaleFont(el) {
    el.style.fontSize = (parseFloat(el.style.fontSize) * SCALE) + 'px';
  }
  // Wheel-local paint wrapper: everything but the bomb goes straight through
  // to ThreesCommon's paintTile, which has no idea BOMB exists (it's a
  // wheel-only tile, unlike the wildcard, so it isn't taught to the shared
  // helper - see canMergeWheel above for the same reasoning applied to
  // merging).
  // A flat, two-tone schematic (solid circle body, straight fuse, diamond
  // spark) rather than a glossy pictorial glyph - the wheel variant's tiles
  // are all flat fills/clip-paths, so a shaded/gradient emoji stood out as
  // the one "3D" element on the board.
  const BOMB_ICON_SVG = `
    <svg viewBox="0 0 64 64" width="60%" height="60%" xmlns="http://www.w3.org/2000/svg">
      <circle cx="29" cy="38" r="19" fill="#2b2b2b"/>
      <line x1="29" y1="19" x2="40" y2="8" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
      <rect x="37.5" y="1.5" width="9" height="9" fill="#ffb020" transform="rotate(45 42 6)"/>
    </svg>`;
  function paintTileWheel(el, value) {
    if (value === BOMB) {
      el.classList.remove('wild');
      el.classList.add('bomb');
      el.style.background = '';
      el.style.fontSize = '32px';
      el.innerHTML = BOMB_ICON_SVG;
      return;
    }
    el.classList.remove('bomb');
    paintTile(el, value);
  }
  function paintTileScaled(el, value) { paintTileWheel(el, value); scaleFont(el); }
  function paintNumeralScaled(el, value) { paintNumeral(el, value); scaleFont(el); }

  function makePreviewTileWheel(value, mini) {
    const el = document.createElement('div');
    el.className = 'tile preview' + (mini ? ' mini' : '');
    paintTileWheel(el, value);
    if (mini) el.style.fontSize = miniFontSize(value);
    return el;
  }
  // Wheel-local fork of ThreesCommon's renderNextIndicator: identical
  // behavior, but bomb-aware (nextValue > 3 on the BOMB string would
  // otherwise coerce to NaN and just happen to fall through safely, but the
  // fallback path still needs makePreviewTileWheel instead of the shared
  // paintTile-based one to actually render it).
  function renderNextIndicatorWheel(containerEl, nextValue, tripleChance) {
    containerEl.innerHTML = '';
    let triple = null;
    if (nextValue !== WILD && nextValue !== BOMB && nextValue > 3 && Math.random() < tripleChance) {
      triple = pickRandom(triplesContaining(nextValue));
    }
    if (triple) {
      for (const v of triple) containerEl.appendChild(makePreviewTileWheel(v, true));
    } else {
      containerEl.appendChild(makePreviewTileWheel(nextValue, false));
    }
  }

  // Wheel-local fork of ThreesCommon's boardScore: a bomb scores nothing,
  // same as a wildcard (scoreForValue itself would choke on a non-numeric,
  // non-WILD value - see the v < 3 / log2 chain - rather than silently
  // returning 0 for one it's never been told about).
  function boardScoreWheel(tv) {
    let total = 0;
    for (const id in tv) total += tv[id] === BOMB ? 0 : scoreForValue(tv[id]);
    return total;
  }

  // Every tile is a .tile-pos wrapper (transform-positioned) around an inner
  // .tile "face" (the existing look, unchanged) - see the CSS comment above
  // .tile-pos for why. elById tracks the wrapper (it's what gets appended to
  // and removed from the board); faceOf() reaches the paintable/animatable
  // inner element wherever code needs it.
  function faceOf(wrap) { return wrap.firstElementChild; }

  function makeTileEl(value, q, r, spawning) {
    const wrap = document.createElement('div');
    wrap.className = 'tile-pos';
    const el = document.createElement('div');
    el.className = 'tile hex-shape' + (spawning ? ' spawning' : '');
    // Drop the class once its one-shot fade-in finishes, so a tile that's been
    // sitting on the board a while can never have a leftover CSS *animation*
    // (as opposed to the transitions everything else here uses) quietly
    // fighting over opacity/transform with a much later merge's fade-out.
    if (spawning) el.addEventListener('animationend', () => el.classList.remove('spawning'), { once: true });
    paintTileScaled(el, value);
    el.style.width = HEX_W + 'px';
    el.style.height = HEX_H + 'px';
    wrap.appendChild(el);
    const { left, top } = cellPos(q, r);
    wrap.style.transform = `translate(${left}px, ${top}px)`;
    return wrap;
  }

  let cellBgEls = [];
  function relayoutAll() {
    for (const { el, q, r } of cellBgEls) {
      el.style.width = HEX_W + 'px';
      el.style.height = HEX_H + 'px';
      const { left, top } = cellPos(q, r);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }
    if (!elById) return;
    for (const [id, wrap] of elById) {
      const face = faceOf(wrap);
      face.style.width = HEX_W + 'px';
      face.style.height = HEX_H + 'px';
      paintTileScaled(face, tileValue[id]);
      const [q, r] = tilePos[id];
      const { left, top } = cellPos(q, r);
      wrap.style.transform = `translate(${left}px, ${top}px)`;
    }
  }

  // Wheel-local fork of the glow burst ThreesCommon's spawnMilestoneGlow adds
  // behind a tile that just set a new record - reused unchanged (same CSS
  // class/keyframe), just positioned by copying the tile-pos wrapper's own
  // transform instead of reading tileEl.style.left/top (which no longer
  // exist here - see makeTileEl above).
  function spawnMilestoneGlowWheel(wrap, boardEl) {
    const face = faceOf(wrap);
    // .milestone-glow's own burst is a CSS *animation* on `transform` (a
    // scale from 0.7 to 2.4) - exactly like a tile's merge-pop, a running
    // animation on transform completely overrides a plain inline
    // `transform: translate()`, for its whole 0.6s run, not just blend with
    // it. Set the translate directly on .milestone-glow (as an earlier
    // version of this did) and the glow renders at whatever `scale()` alone
    // resolves to - no translate at all - i.e. pinned to this wrapper's
    // left:0/top:0, the board's top-left corner. Same fix as the tiles: a
    // position-only wrapper around the unmodified, shared .milestone-glow,
    // which keeps just the scale/opacity burst.
    const glowPos = document.createElement('div');
    glowPos.style.position = 'absolute';
    glowPos.style.left = '0';
    glowPos.style.top = '0';
    glowPos.style.transform = wrap.style.transform;
    const glow = document.createElement('div');
    glow.className = 'milestone-glow';
    glow.style.left = '0';
    glow.style.top = '0';
    glow.style.width = face.style.width;
    glow.style.height = face.style.height;
    glowPos.appendChild(glow);
    boardEl.appendChild(glowPos);
    setTimeout(() => glowPos.remove(), 650);
  }

  // Same positioning trick as spawnMilestoneGlowWheel above, but tinted to
  // an arbitrary color instead of the fixed white .milestone-glow - used for
  // a bomb detonation's burst, where each cleared tile's own color (not one
  // fixed color) is what makes a whole rank clearing away read as connected
  // pops rather than one generic effect.
  function spawnColoredGlow(wrap, boardEl, color) {
    const face = faceOf(wrap);
    const glowPos = document.createElement('div');
    glowPos.style.position = 'absolute';
    glowPos.style.left = '0';
    glowPos.style.top = '0';
    glowPos.style.transform = wrap.style.transform;
    const glow = document.createElement('div');
    glow.className = 'bomb-glow';
    glow.style.left = '0';
    glow.style.top = '0';
    glow.style.width = face.style.width;
    glow.style.height = face.style.height;
    glow.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
    glowPos.appendChild(glow);
    boardEl.appendChild(glowPos);
    setTimeout(() => glowPos.remove(), 500);
  }

  // Wheel-local fork of ThreesCommon's animateMove: identical behavior and
  // timing (losers slide into their winner's cell and fade/flip away,
  // survivors glide to their new cell and pop/flip, and only once all of
  // that has settled does the spawned tile slide in), but every position
  // change targets a tile's .tile-pos wrapper (transform) instead of the
  // tile itself (left/top) - see the CSS comment above .tile-pos, and
  // makeTileEl, for why. Not a change to the shared animateMove: this board's
  // whole-wheel rotate + cascading-fall animation puts far more tiles in
  // motion at once than the other variants' single-step slides ever do,
  // which is what made the left/top layout-trigger cost (compounded by this
  // board's stacked drop-shadow + clip-path tiles) noticeable on mobile.
  function animateMoveWheel(ctx) {
    const {
      elById, tileValue, tilePos, allMerges, loserFinalPos, spawnedId, spawnValue,
      boardEl, cellPos, createTileEl, milestoneIds, spawnEnterFrom,
      slideMs, winnerFlipMs, loserFlipMs, spawnSlideMs,
      spawnMerges, spawnLoserFinalPos,
      // Extra pause before the spawn appears at all, for a bomb detonation
      // (see resolveBombDetonations) the *rotation's* fall exposed - that
      // needs to finish (pop, then close its own gaps) before the spawn
      // zone below is even meaningful, since it can shift which cells are
      // actually the lowest-empty ones. Optional callback fired once the
      // spawn side of this turn (its own slide-in, plus its own landing
      // merge if any) has fully settled - see startFallPhase, which uses it
      // to time the spawn's own possible detonation.
      extraSpawnDelayMs = 0, onSpawnSettled,
    } = ctx;
    const winnerMeta = new Map(allMerges.map(m => [m.winnerId, m]));

    // Losers slide into the winner's final spot, then fade out (or flip-reveal first).
    for (const m of allMerges) {
      const { loserId, loserWasWild, revealValue } = m;
      const wrap = elById.get(loserId);
      if (!wrap) continue;
      const face = faceOf(wrap);
      const [a, b] = loserFinalPos[loserId];
      const { left, top } = cellPos(a, b);
      wrap.style.zIndex = '1';
      wrap.style.transform = `translate(${left}px, ${top}px)`;

      if (loserWasWild) {
        face.classList.add('wild-loser-flip');
        setTimeout(() => paintNumeralScaled(face, revealValue), Math.round(loserFlipMs * 0.5));
      } else {
        face.style.opacity = '0';
        face.style.transform = 'scale(0.4)';
      }
      setTimeout(() => {
        wrap.remove();
        elById.delete(loserId);
      }, loserFlipMs);
    }

    // Survivors (including merge winners) glide to their new cell.
    for (const idStr in tilePos) {
      const id = Number(idStr);
      if (id === spawnedId) continue;
      const wrap = elById.get(id);
      if (!wrap) continue;
      const face = faceOf(wrap);
      const [a, b] = tilePos[id];
      const { left, top } = cellPos(a, b);
      wrap.style.transform = `translate(${left}px, ${top}px)`;

      const meta = winnerMeta.get(id);
      if (meta && meta.winnerWasWild) {
        // Card-flip from wildcard to the resulting number as the merge lands.
        setTimeout(() => {
          face.classList.remove('merging');
          face.classList.add('wild-winner-flip');
          setTimeout(() => paintTileScaled(face, meta.newValue), Math.round(winnerFlipMs * 0.5));
          setTimeout(() => face.classList.remove('wild-winner-flip'), winnerFlipMs);
        }, slideMs);
      } else if (meta && tileValue[id] !== undefined) {
        // A merge winner that a same-turn bomb detonation *also* swept away
        // (its rank matched what a bomb cleared) is already gone from
        // tileValue by now - skip the pop-and-repaint entirely for it; its
        // removal/fade plays separately, via playBombRemovals instead.
        const value = tileValue[id];
        const isMilestone = milestoneIds && milestoneIds.has(id);
        setTimeout(() => {
          paintTileScaled(face, value);
          face.classList.remove('merging', 'milestone-pop');
          void face.offsetWidth;
          face.classList.add(isMilestone ? 'milestone-pop' : 'merging');
          if (isMilestone) spawnMilestoneGlowWheel(wrap, boardEl);
        }, slideMs);
      }
    }

    // Only after the slide (and any merge fallout) has fully played does the new
    // tile appear, sliding in from just beyond the edge in the swipe's direction.
    if (spawnedId != null) {
      const spawnDelay = (allMerges.length > 0 ? slideMs + winnerFlipMs : slideMs) + extraSpawnDelayMs;
      setTimeout(() => {
        const [a, b] = tilePos[spawnedId];
        // Paint with spawnValue (its value *before* any landing-merge), not
        // tileValue[spawnedId] - if it goes on to merge away below, that
        // entry may already be gone by now (tileValue was updated synchronously
        // back in startFallPhase, well before this tile even visually exists).
        const wrap = createTileEl(spawnValue, a, b, false);
        if (spawnEnterFrom) {
          const finalTransform = wrap.style.transform;
          wrap.style.transition = 'none';
          wrap.style.transform = `translate(${spawnEnterFrom.left}px, ${spawnEnterFrom.top}px)`;
          boardEl.appendChild(wrap);
          void wrap.offsetWidth; // force layout so the jump above isn't itself animated
          wrap.style.transition = spawnSlideMs != null
            ? `transform ${spawnSlideMs}ms cubic-bezier(.32,.72,.35,1)`
            : '';
          wrap.style.transform = finalTransform;
        } else {
          boardEl.appendChild(wrap);
        }
        elById.set(spawnedId, wrap);

        // If the spawn landed on a match, play that merge (and any further
        // cascade among the heap tiles below it) right after it's visibly
        // finished falling in - same collapse rule as a rotation's fall,
        // just triggered by the spawn instead of a rotation (see
        // startFallPhase). Skipped entirely if it didn't land on a match.
        const mergeDelay = spawnEnterFrom ? (spawnSlideMs != null ? spawnSlideMs : 0) : 0;
        if (spawnMerges && spawnMerges.length > 0) {
          setTimeout(() => {
            playMergeEvents(spawnMerges, spawnLoserFinalPos, tileValue, milestoneIds, boardEl);
            if (onSpawnSettled) setTimeout(onSpawnSettled, winnerFlipMs);
          }, mergeDelay);
        } else if (onSpawnSettled) {
          setTimeout(onSpawnSettled, mergeDelay);
        }
      }, spawnDelay);
    } else if (onSpawnSettled) {
      onSpawnSettled();
    }
  }

  // Plays the loser-slides-and-fades / winner-pops-or-flips visual treatment
  // for an explicit list of merge events, rather than scanning every current
  // tile the way the main loops above do - used for a spawn's own landing
  // merge, where only the newly-spawned tile and whatever it touched are
  // involved. Reuses the exact same transitions/timings/CSS classes as the
  // main merge handling above for a consistent look.
  function playMergeEvents(merges, finalPosMap, tileValue, milestoneIds, boardEl) {
    // A winnerId here isn't necessarily a final survivor: if this batch
    // itself cascades (the spawn's merge lands next to another match, same
    // as any other cascade), an early winner can become a later loser within
    // these same events. winnerMeta would otherwise still process it as a
    // "survivor" purely because it once won - unlike the main loops above,
    // which only ever visit ids still present in tilePos (final by
    // definition), this one works from an explicit list, so it needs its own
    // explicit exclusion.
    const loserIdsInBatch = new Set(merges.map(m => m.loserId));
    const winnerMeta = new Map(merges.map(m => [m.winnerId, m]));
    for (const m of merges) {
      const { loserId, loserWasWild, revealValue } = m;
      const wrap = elById.get(loserId);
      if (!wrap) continue;
      const face = faceOf(wrap);
      const [a, b] = finalPosMap[loserId];
      const { left, top } = cellPos(a, b);
      setTilePosTransition(wrap, FALL_MS);
      setLoserFaceTransition(face, FALL_MS);
      wrap.style.zIndex = '1';
      wrap.style.transform = `translate(${left}px, ${top}px)`;

      if (loserWasWild) {
        face.classList.add('wild-loser-flip');
        setTimeout(() => paintNumeralScaled(face, revealValue), Math.round(LOSER_FLIP_MS * 0.5));
      } else {
        face.style.opacity = '0';
        face.style.transform = 'scale(0.4)';
      }
      setTimeout(() => {
        wrap.remove();
        elById.delete(loserId);
      }, LOSER_FLIP_MS);
    }

    for (const [winnerId, m] of winnerMeta) {
      if (loserIdsInBatch.has(winnerId)) continue; // absorbed further in this same cascade - not a final survivor
      const wrap = elById.get(winnerId);
      if (!wrap) continue;
      const face = faceOf(wrap);
      if (m.winnerWasWild) {
        face.classList.remove('merging');
        face.classList.add('wild-winner-flip');
        setTimeout(() => paintTileScaled(face, m.newValue), Math.round(WINNER_FLIP_MS * 0.5));
        setTimeout(() => face.classList.remove('wild-winner-flip'), WINNER_FLIP_MS);
      } else if (tileValue[winnerId] !== undefined) {
        // Same guard as animateMoveWheel's survivor repaint: a winner whose
        // rank a same-turn bomb detonation *also* swept away is already
        // gone from tileValue by the time this runs - its removal/fade
        // plays separately, via playBombRemovals instead.
        const value = tileValue[winnerId];
        const isMilestone = milestoneIds && milestoneIds.has(winnerId);
        paintTileScaled(face, value);
        face.classList.remove('merging', 'milestone-pop');
        void face.offsetWidth;
        face.classList.add(isMilestone ? 'milestone-pop' : 'merging');
        if (isMilestone) spawnMilestoneGlowWheel(wrap, boardEl);
      }
    }
  }

  // Detonates every tile a bomb (or chain of bombs) just cleared: the
  // bomb(s) flash first, then every tile in the batch (the bomb(s) and
  // every same-rank tile) pops outward and vanishes in place, each with its
  // own color-matched burst - an explosion, not a quiet merge-style
  // shrink-and-fade (there's no winner for them to slide toward anyway,
  // unlike an ordinary merge). Positions/colors come straight off each
  // tile's still-attached DOM element (elById/faceOf) since these ids are
  // already gone from tileValue/grid (resolveBombDetonations already
  // removed them) by the time this plays.
  function playBombRemovals(events, removedIds, boardEl) {
    for (const { bombId, rank } of events) {
      const wrap = elById.get(bombId);
      if (!wrap) continue;
      // Recolor the bomb to the rank it just matched, right as it goes off -
      // makes it obvious *what* it detonated against, not just that
      // something did. Set before the burst below so its own glow (which
      // reads straight off this background) picks up the same color too.
      faceOf(wrap).style.background = tileColor(rank).bg;
      spawnColoredGlow(wrap, boardEl, 'rgba(255,140,60,0.95)');
    }
    for (const id of removedIds) {
      const wrap = elById.get(id);
      if (!wrap) continue;
      const face = faceOf(wrap);
      spawnColoredGlow(wrap, boardEl, face.style.background || 'rgba(255,255,255,0.9)');
      face.classList.remove('merging', 'milestone-pop');
      void face.offsetWidth; // force layout so a tile mid-merge-pop restarts cleanly into this animation instead of blending with it
      face.classList.add('bomb-explode');
      setTimeout(() => {
        wrap.remove();
        elById.delete(id);
      }, BOMB_POP_MS);
    }
  }

  // Slides every surviving tile to its (possibly new) cell after a
  // detonation closed some gaps - the same plain position transition the
  // main fall stage uses, just triggered by a removal instead of a rotation.
  function slideSurvivorsTo(newTilePosMap, ms) {
    for (const idStr in newTilePosMap) {
      const id = Number(idStr);
      const wrap = elById.get(id);
      if (!wrap) continue;
      setTilePosTransition(wrap, ms);
      const [a, b] = newTilePosMap[id];
      const { left, top } = cellPos(a, b);
      wrap.style.transform = `translate(${left}px, ${top}px)`;
    }
  }

  function updateScoreDisplay(animatePop) {
    const newScore = boardScoreWheel(tileValue).toLocaleString();
    if (newScore === scoreValueEl.textContent) return;
    scoreValueEl.textContent = newScore;
    if (animatePop) {
      scoreValueEl.classList.remove('pop');
      void scoreValueEl.offsetWidth;
      scoreValueEl.classList.add('pop');
    }
  }

  function startGame() {
    grid = new Map();
    tileValue = {};
    tilePos = {};
    elById = new Map();
    idCounter = 1;
    rotating = false;
    queuedMove = null;
    lastSpawnValue = null;
    lastSpawnStreak = 0;

    boardEl.innerHTML = '';
    cellBgEls = [];
    for (const [q, r] of ALL_CELLS) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg hex-shape';
      bg.style.width = HEX_W + 'px';
      bg.style.height = HEX_H + 'px';
      const { left, top } = cellPos(q, r);
      bg.style.left = left + 'px';
      bg.style.top = top + 'px';
      boardEl.appendChild(bg);
      cellBgEls.push({ el: bg, q, r });
    }

    const starterIds = [];
    const starterCount = Math.round(ALL_CELLS.length * STARTER_FILL_RATIO);
    for (let i = 0; i < starterCount; i++) {
      const id = placeRandomTile(drawStarterValue());
      if (id) starterIds.push(id);
    }
    for (const id of starterIds) {
      const [q, r] = tilePos[id];
      const el = makeTileEl(tileValue[id], q, r, true);
      boardEl.appendChild(el);
      elById.set(id, el);
    }
    recordMax = currentMaxValue(tileValue);
    highestMatchValue = 0;

    nextValue = drawNextValue();
    renderNextIndicatorWheel(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(highestMatchValue);
    updateScoreDisplay(false);
    overlayEl.classList.add('hidden');
  }

  // Pure computation of what a rotation (60 or 120 degrees, per `steps`)
  // would do to the current grid: no mutation, no animation - just the
  // resulting grid/positions, plus each currently-placed tile's pixel
  // *center* before this rotation (what tweenArc needs to animate it along
  // the correct arc; the "to" cell position isn't needed for that since
  // rotating the center by exactly +-60/120 degrees around the board's
  // center *is* where it ends up, by construction - no separate lookup can
  // disagree). startCenters is identical regardless of steps (it's each
  // tile's position *before* any rotation), so a caller computing both a
  // 1-step and 2-step version for the same direction can reuse either one's.
  // Shared by the instant button/keyboard path and the live drag preview.
  function computeRotation(dir, steps = 1) {
    const rotateFn = dir === 'CW' ? rotateCW : rotateCCW;
    const newGrid = new Map();
    const newTilePos = {};
    const startCenters = new Map();
    for (const [key, id] of grid) {
      const [q, r] = parseKey(key);
      let nq = q, nr = r;
      for (let i = 0; i < steps; i++) [nq, nr] = rotateFn(nq, nr);
      newGrid.set(cellKey(nq, nr), id);
      newTilePos[id] = [nq, nr];
      const { left, top } = cellPos(q, r);
      startCenters.set(id, { cx: left + HEX_W / 2, cy: top + HEX_H / 2 });
    }
    return { newGrid, newTilePos, startCenters };
  }

  // Stage 2 (gravity + merges) and stage 3 (the new tile). Called once stage 1
  // (rotation) has fully settled, from a fixed pause after it, regardless of
  // whether that rotation was an instant button/key press or a released drag.
  function startFallPhase(newGrid, newTilePos) {
    grid = newGrid;
    tilePos = newTilePos;

    const fallResult = resolveFall(grid, tileValue);
    for (const { winnerId, loserId, newValue } of fallResult.allMerges) {
      tileValue[winnerId] = newValue;
      delete tileValue[loserId];
      if (newValue > highestMatchValue) highestMatchValue = newValue;
    }
    grid = new Map(fallResult.newEntries.filter(([, id]) => id != null));
    const settledTilePos = {};
    for (const [key, id] of grid) settledTilePos[id] = parseKey(key);
    // A cascade can make today's winner tomorrow's loser (3+3=6 sliding into
    // an existing 6, then that 6 immediately merging again into 12) - so a
    // merge's winnerId isn't necessarily one of today's survivors. Follow the
    // chain of who-absorbed-whom to find the id that's actually still on the
    // board, and send the loser to *that* tile's final resting place.
    const nextOwner = new Map();
    for (const { winnerId, loserId } of fallResult.allMerges) nextOwner.set(loserId, winnerId);
    function finalSurvivorOf(id) {
      while (nextOwner.has(id)) id = nextOwner.get(id);
      return id;
    }
    const loserFinalPos = {};
    for (const { loserId } of fallResult.allMerges) loserFinalPos[loserId] = settledTilePos[finalSurvivorOf(loserId)];
    tilePos = settledTilePos;

    // A resting bomb this rotation's fall just brought into contact with a
    // match detonates now, before the spawn zone below is even computed -
    // mirrors how the fall's own merges resolve first, and matters here
    // because clearing tiles can change which cells count as "empty". Grid
    // (the real occupancy map the spawn zone reads from just below) is
    // updated right away; `tilePos` deliberately stays untouched by this -
    // it still drives animateMoveWheel's own "survivors glide" call below,
    // which needs to land everything at its *pre-detonation* position first
    // (unaffected ids' entries are identical either way; a detonation-doomed
    // id's stale entry here is just a harmless glide-to-itself, since its
    // real removal/pop is a separate, later-timed step - see
    // postFallBombTilePos below, used only for that).
    const fallBomb = resolveBombDetonations(grid, tileValue);
    const postFallBombTilePos = {};
    for (const [key, id] of grid) postFallBombTilePos[id] = parseKey(key);

    // Spawn zone: the lowest *empty* cell in each column - directly on top of
    // that column's current heap (the bottom cell, for a column that's empty
    // altogether) - rather than the fixed top edge, so a new tile always
    // visibly lands on the pile instead of floating above it with a gap. It
    // enters by falling in from that column's top edge, echoing the board's
    // own gravity rather than a plain pop-in (and gracefully becomes a
    // same-spot pop when the column's already full up to its top edge).
    const spawnCells = [];
    for (const line of FALL_LINES) {
      for (const key of line) {
        if (!grid.get(key)) { spawnCells.push({ key, enterFromKey: line[line.length - 1] }); break; }
      }
    }
    let spawnedId = null, spawnEnterFrom = null, spawnValue = null;
    let spawnMerges = [], spawnLoserFinalPos = {};
    if (spawnCells.length > 0) {
      const { key, enterFromKey } = pickRandom(spawnCells);
      const [q, r] = parseKey(key);
      const id = idCounter++;
      recordSpawn(nextValue);
      spawnValue = nextValue;
      spawnedId = id;
      nextValue = drawNextValue();
      spawnEnterFrom = cellPos(...parseKey(enterFromKey));
      // Purely for the animation's benefit - where to *create* the spawn tile
      // - regardless of whether it goes on to merge away below. grid (the
      // real occupancy map) is untouched here; this round's tilePos object
      // gets rebuilt from scratch next round, so a stale entry for a tile
      // that dies below never lingers.
      tilePos[id] = [q, r];

      // If the new tile can merge with whatever's already at the top of its
      // column's heap, resolve that right away - the same full-cascade
      // collapse the rotation stage uses (collapseLineFull), just seeded
      // with this spawn instead of a rotation. grid/tileValue/tilePos land in
      // their final, post-cascade state now; the *visual* merge plays out
      // later, once the spawn tile has actually finished falling in (see
      // animateMoveWheel/playMergeEvents).
      const line = FALL_LINES.find(l => l.includes(key));
      const slots = line.map(k => {
        if (k === key) return { id, value: spawnValue };
        const existingId = grid.get(k);
        return existingId ? { id: existingId, value: tileValue[existingId] } : null;
      });
      const { merges, newLine } = collapseLineFull(slots);
      spawnMerges = merges;
      if (merges.length > 0) {
        for (const { winnerId, loserId, newValue } of merges) {
          tileValue[winnerId] = newValue;
          delete tileValue[loserId];
          if (newValue > highestMatchValue) highestMatchValue = newValue;
        }
        const spawnNextOwner = new Map();
        for (const { winnerId, loserId } of merges) spawnNextOwner.set(loserId, winnerId);
        const spawnFinalSurvivorOf = (fid) => {
          while (spawnNextOwner.has(fid)) fid = spawnNextOwner.get(fid);
          return fid;
        };
        line.forEach((k, i) => {
          if (newLine[i]) { grid.set(k, newLine[i].id); tilePos[newLine[i].id] = parseKey(k); }
          else grid.delete(k);
        });
        for (const { loserId } of merges) {
          spawnLoserFinalPos[loserId] = tilePos[spawnFinalSurvivorOf(loserId)];
        }
      } else {
        grid.set(key, id);
        tileValue[id] = spawnValue;
      }
    }

    // The spawned tile itself detonating (a bomb landing on a match) is
    // just as likely here as any other spawn-landing merge above - but
    // never *is* one, since a bomb never merges through the normal system
    // (see canMergeWheel), so this is a wholly separate check, same as the
    // fall's own bomb check above. Same reasoning as postFallBombTilePos:
    // `tilePos` (in particular, tilePos[spawnedId] - the spawn's own
    // landing spot, needed below to even create its DOM element) stays as
    // it already was, untouched by this; the detonation's own compaction
    // only shows up later, via postSpawnBombTilePos below.
    const spawnBomb = resolveBombDetonations(grid, tileValue);
    const postSpawnBombTilePos = {};
    for (const [key, id] of grid) postSpawnBombTilePos[id] = parseKey(key);

    let milestoneIds = null;
    const newMax = currentMaxValue(tileValue);
    if (newMax > recordMax) {
      const allMergesSoFar = fallResult.allMerges.concat(spawnMerges);
      milestoneIds = new Set(allMergesSoFar.filter(m => m.newValue === newMax).map(m => m.winnerId));
      recordMax = newMax;
    }
    if (fallResult.allMerges.length > 0 || spawnMerges.length > 0) {
      hapticTick(milestoneIds && milestoneIds.size > 0 ? [15, 40, 15] : 20);
    }
    if (fallBomb.events.length > 0 || spawnBomb.events.length > 0) hapticTick([20, 50, 20]);

    // Stage 2's travel speed: applied to every tile currently on the board
    // (not the not-yet-created spawn) right before animateMoveWheel moves any
    // of them, since it has no duration knob of its own - see
    // setTilePosTransition. Losers additionally get the delayed fade/shrink
    // on their inner face so they visibly fall the whole way before
    // disappearing, rather than fading out mid-fall.
    const loserIds = new Set(fallResult.allMerges.map(m => m.loserId));
    for (const [id, wrap] of elById) {
      setTilePosTransition(wrap, FALL_MS);
      if (loserIds.has(id)) setLoserFaceTransition(faceOf(wrap), FALL_MS);
    }

    // How long the fall's own merges take to visually resolve - the moment
    // a fall-triggered detonation's pop should start (right where the spawn
    // used to appear, before extraSpawnDelayMs below pushed it back), and
    // how long the detonation itself then adds on top before the spawn
    // actually shows up.
    const fallMergeSettleMs = fallResult.allMerges.length > 0 ? FALL_MS + WINNER_FLIP_MS : FALL_MS;
    const fallBombMs = fallBomb.removedIds.size > 0 ? BOMB_POP_MS + BOMB_PAUSE_MS + FALL_MS : 0;
    const spawnBombMs = spawnBomb.removedIds.size > 0 ? BOMB_POP_MS + BOMB_PAUSE_MS + FALL_MS : 0;

    animateMoveWheel({
      elById, tileValue, tilePos, allMerges: fallResult.allMerges, loserFinalPos, spawnedId, spawnValue,
      boardEl, cellPos, createTileEl: makeTileEl, milestoneIds, spawnEnterFrom,
      slideMs: FALL_MS, winnerFlipMs: WINNER_FLIP_MS, loserFlipMs: LOSER_FLIP_MS,
      // Reuses the same gravity pace as the rest of the fall stage - the entry
      // distance now varies with how tall the column's heap already is
      // (unlike the other variants' fixed one-pitch spawn hop), so a fixed
      // short transition would look like a snap rather than a fall.
      spawnSlideMs: FALL_MS,
      spawnMerges, spawnLoserFinalPos,
      // A fall-triggered detonation needs to finish (pop, then close its own
      // gaps) before the spawn appears at all - see postFallBombTilePos.
      extraSpawnDelayMs: fallBombMs,
      // Once the spawn side of this turn (its own slide-in, plus its own
      // landing merge if any) has fully settled, play the spawn's own
      // detonation, if it had one (see postSpawnBombTilePos).
      onSpawnSettled: spawnBomb.removedIds.size > 0 ? () => {
        playBombRemovals(spawnBomb.events, spawnBomb.removedIds, boardEl);
        setTimeout(() => slideSurvivorsTo(postSpawnBombTilePos, FALL_MS), BOMB_POP_MS + BOMB_PAUSE_MS);
      } : undefined,
    });

    // A fall-triggered detonation plays right where the fall's own merges
    // just settled - i.e. right where the spawn used to appear before
    // extraSpawnDelayMs (above) pushed it back to make room for this.
    if (fallBomb.removedIds.size > 0) {
      setTimeout(() => {
        playBombRemovals(fallBomb.events, fallBomb.removedIds, boardEl);
        setTimeout(() => slideSurvivorsTo(postFallBombTilePos, FALL_MS), BOMB_POP_MS + BOMB_PAUSE_MS);
      }, fallMergeSettleMs);
    }

    renderNextIndicatorWheel(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(highestMatchValue);
    updateScoreDisplay(true);

    const settleMs = fallMergeSettleMs + 30 + fallBombMs
      + (spawnCells.length > 0 ? FALL_MS : 0) // the spawn's own fall-in
      + (spawnMerges.length > 0 ? WINNER_FLIP_MS : 0) // its landing-merge pop, if any
      + spawnBombMs; // the spawn's own detonation, if it had one
    setTimeout(() => {
      rotating = false;
      if (isWheelGameOver()) {
        overlayTextEl.textContent = 'Game Over';
        overlayEl.classList.remove('hidden');
        queuedMove = null;
        hapticTick([30, 60, 30]);
      } else {
        consumeQueuedMove();
      }
    }, settleMs);
  }

  // Best-effort haptic feedback: a short buzz on a committed rotation, a
  // slightly longer one on a merge (longer still for a new record tile), and
  // a distinct pattern on game over. Supported on Android Chrome via the
  // Vibration API; silently a no-op everywhere else, notably iOS Safari,
  // which (as of this writing) has never implemented navigator.vibrate at all.
  function hapticTick(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  // Fires the moment the board frees up if a move arrived while it was busy.
  function consumeQueuedMove() {
    if (!queuedMove) return;
    const dir = queuedMove;
    queuedMove = null;
    move(dir, false); // no press is currently in progress to wait on - just a plain 60
  }

  // A button/keyboard rotation always starts as a plain 60-degree turn. If
  // the press is still down LONG_PRESS_MS later, the second 60 degrees
  // (on to 120) plays automatically right then - while still held - so
  // holding long enough is confirmed visually instead of being a guess.
  // Releasing never itself changes how far the wheel has turned; it just
  // hands off to stage 2 (the fall) from wherever the rotation has landed,
  // once that rotation has actually finished animating.
  let activeMove = null; // { dir, startCenters, newGrid1, newTilePos1, newGrid2, newTilePos2, tweenDone, released, upgraded, upgradeTimer }
  const LONG_PRESS_MS = 300;
  // Independent per direction (not just "the one thing currently held") so a
  // stray overlapping press/hold of the *other* direction - e.g. a key held
  // down while also clicking a button - can't clobber this one's release
  // bookkeeping and leave it waiting forever.
  const pressStart = { CW: null, CCW: null };

  // Stage 1, instant path (button/keyboard): animate 60 degrees at
  // ROTATE_MS, then - after the small settling pause - hand off to stage 2.
  // `live` distinguishes an actual press (arms the long-press upgrade timer
  // and waits for onPressEnd's release before finalizing - see beginRotation)
  // from a queued move being consumed once the board frees up (no press is
  // currently in progress to time, so it just settles for a plain 60 as soon
  // as the tween's done). The drag path below does the live-press equivalent
  // but lets the player control progress through stage 1 directly instead of
  // jumping straight to done. If the board is already busy, the direction is
  // queued instead of dropped - see queuedMove/consumeQueuedMove.
  function move(dir, live) {
    if (!overlayEl.classList.contains('hidden')) return;
    if (rotating || drag) { queuedMove = dir; return; }
    rotating = true;
    hapticTick(10);
    beginRotation(dir, live);
  }

  function beginRotation(dir, live) {
    const sign = dir === 'CW' ? 1 : -1;
    const { newGrid: newGrid1, newTilePos: newTilePos1, startCenters } = computeRotation(dir, 1);
    activeMove = {
      dir, startCenters, newGrid1, newTilePos1,
      tweenDone: false, released: !live, upgraded: false, upgradeTimer: null,
    };
    if (live) {
      // ROTATE_MS (the full stage-1 tween) is well under LONG_PRESS_MS, so by
      // the time this fires the 60-degree tween has always already landed -
      // safe to jump straight into the second half of the spin.
      activeMove.upgradeTimer = setTimeout(() => {
        if (activeMove && activeMove.dir === dir) beginUpgrade();
      }, LONG_PRESS_MS);
    }
    tweenArc(startCenters, 0, sign * 60, ROTATE_MS, () => {
      if (!activeMove || activeMove.dir !== dir || activeMove.upgraded) return; // safety - shouldn't happen, but never act on a stale/superseded tween
      activeMove.tweenDone = true;
      maybeFinalize();
    });
  }

  // Fired automatically once a live press has been held past LONG_PRESS_MS -
  // continues the spin on to 120 right away, regardless of whether the press
  // is still down; onPressEnd/maybeFinalize just wait for it to land.
  function beginUpgrade() {
    const { dir, startCenters } = activeMove;
    activeMove.upgraded = true;
    activeMove.upgradeTimer = null;
    activeMove.tweenDone = false;
    const sign = dir === 'CW' ? 1 : -1;
    const { newGrid: newGrid2, newTilePos: newTilePos2 } = computeRotation(dir, 2);
    activeMove.newGrid2 = newGrid2;
    activeMove.newTilePos2 = newTilePos2;
    hapticTick(10);
    tweenArc(startCenters, sign * 60, sign * 120, ROTATE_MS, () => {
      if (!activeMove || activeMove.dir !== dir) return;
      activeMove.tweenDone = true;
      maybeFinalize();
    });
  }

  // Called once both the current tween has visually finished *and* the press
  // has been released (in whichever order those happen to occur) - hands off
  // to stage 2 (the fall) from wherever the rotation ended up landing.
  function maybeFinalize() {
    if (!activeMove || !activeMove.tweenDone || !activeMove.released) return;
    const { upgraded, newGrid1, newTilePos1, newGrid2, newTilePos2 } = activeMove;
    const newGrid = upgraded ? newGrid2 : newGrid1;
    const newTilePos = upgraded ? newTilePos2 : newTilePos1;
    activeMove = null;
    setTimeout(() => startFallPhase(newGrid, newTilePos), ROTATE_PAUSE_MS);
  }

  function onPressStart(dir) {
    if (pressStart[dir] != null) return; // already down - ignore OS key-repeat/duplicate events
    pressStart[dir] = true;
    move(dir, true);
  }

  function onPressEnd(dir) {
    if (pressStart[dir] == null) return;
    pressStart[dir] = null;
    if (activeMove && activeMove.dir === dir) {
      if (activeMove.upgradeTimer) { clearTimeout(activeMove.upgradeTimer); activeMove.upgradeTimer = null; }
      activeMove.released = true;
      maybeFinalize();
    }
  }

  applyBoardDimensions();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      applyBoardDimensions();
      relayoutAll();
    }, 120);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); onPressStart('CCW'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); onPressStart('CW'); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') onPressEnd('CCW');
    else if (e.key === 'ArrowRight') onPressEnd('CW');
  });

  rotateControlsEl.addEventListener('pointerdown', (e) => e.stopPropagation());
  // Pointer capture keeps pointerup/pointercancel targeting the button even
  // if the pointer drifts off it before releasing, so a hold's release is
  // never missed just because the finger/cursor moved slightly.
  function wireHoldButton(btn, dir) {
