    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      onPressStart(dir);
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    });
    btn.addEventListener('pointerup', () => onPressEnd(dir));
    btn.addEventListener('pointercancel', () => onPressEnd(dir));
  }
  wireHoldButton(rotateCcwBtn, 'CCW');
  wireHoldButton(rotateCwBtn, 'CW');

  // Stage 1, live-drag path: swipe anywhere in the centered area (including
  // the blank margin around the board), in *any* direction, not just
  // horizontal - what matters is which way the touch point is sweeping around
  // the board's center, exactly like actually turning a wheel by its rim.
  // Concretely: track the angle from the board's center to the pointer, and
  // rotate the wheel by exactly how much that angle has changed since
  // pointerdown (clamped to +-120 degrees now, not +-60 - see
  // DRAG_EASE_RANGE_2). This one rule reproduces every case a "grab the rim"
  // gesture should: at the top of the circle, rightward motion is clockwise;
  // at the bottom, leftward is; at the left edge, upward is; at the right
  // edge, downward is - which is also exactly why a swipe starting below the
  // board (the common case, given how much of the tap area is blank space
  // under it) reads as "left = clockwise, right = counterclockwise" at a
  // glance, without that being a special case.
  //
  // Releasing snaps the rest of the way to whichever stop - back to start, 60
  // degrees, or 120 - the current progress is closest to, then either hands
  // off to stage 2 (60 or 120 committed) or just stops (cancelled, no state
  // change at all).
  let drag = null; // { center, startAngle, dir, startCenters, newGrid1, newTilePos1, newGrid2, newTilePos2, progressDeg }

  function angleFromCenter(clientX, clientY, center) {
    return Math.atan2(clientY - center.y, clientX - center.x) * 180 / Math.PI;
  }

  function applyDragAngle(deg) {
    const bcx = BOARD_W / 2, bcy = BOARD_H / 2;
    for (const [id, { cx, cy }] of drag.startCenters) {
      const el = elById.get(id);
      if (!el) continue;
      const p = rotatePoint(cx, cy, bcx, bcy, deg);
      el.style.transform = `translate(${p.x - HEX_W / 2}px, ${p.y - HEX_H / 2}px)`;
    }
  }

  // Pointerdown/move keep tracking even while the board is busy (rotating),
  // so a swipe that starts mid-animation isn't just silently ignored - it
  // still gets its direction read, just with no live preview to animate
  // (see the `rotating` checks below); finishDrag then queues or fires it.
  mainEl.addEventListener('pointerdown', (e) => {
    if (!overlayEl.classList.contains('hidden')) return;
    const rect = boardEl.getBoundingClientRect();
    const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    drag = { center, startAngle: angleFromCenter(e.clientX, e.clientY, center), dir: null, startCenters: null, progressDeg: 0 };
    mainEl.setPointerCapture(e.pointerId);
  });

  mainEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const curAngle = angleFromCenter(e.clientX, e.clientY, drag.center);
    let delta = curAngle - drag.startAngle;
    while (delta > 180) delta -= 360;
    while (delta <= -180) delta += 360;

    if (!drag.dir) {
      if (Math.abs(delta) < DRAG_ANGLE_DEADZONE) return;
      drag.dir = delta > 0 ? 'CW' : 'CCW';
      if (rotating) return; // busy - direction noted, but nothing to preview live
      // Both stops are precomputed once up front, from the same (unrotated)
      // grid - which one actually applies is only decided on release, once
      // the final progress (and so which stop it's closest to) is known.
      const step1 = computeRotation(drag.dir, 1);
      const step2 = computeRotation(drag.dir, 2);
      drag.newGrid1 = step1.newGrid; drag.newTilePos1 = step1.newTilePos;
      drag.newGrid2 = step2.newGrid; drag.newTilePos2 = step2.newTilePos;
      drag.startCenters = step1.startCenters; // identical either way - see computeRotation
      for (const [id] of drag.startCenters) {
        const el = elById.get(id);
        if (el) el.style.transition = 'none';
      }
    }

    if (!drag.startCenters) return; // board was busy when the deadzone was crossed
    const sign = drag.dir === 'CW' ? 1 : -1;
    const swept = sign * delta; // physical degrees swept in the committed direction (negative = backtrack past start)
    let progressDeg;
    if (swept <= 0) {
      progressDeg = 0;
    } else if (swept <= DRAG_EASE_RANGE) {
      progressDeg = 60 * easeOutCubic(swept / DRAG_EASE_RANGE);
    } else {
      const extra = Math.min(DRAG_EASE_RANGE_2, swept - DRAG_EASE_RANGE);
      progressDeg = 60 + 60 * (extra / DRAG_EASE_RANGE_2);
    }
    drag.progressDeg = progressDeg;
    applyDragAngle(sign * progressDeg);
  });

  function finishDrag() {
    if (!drag) return;
    const { dir, startCenters, progressDeg, newGrid1, newTilePos1, newGrid2, newTilePos2 } = drag;
    drag = null;
    if (!dir) return; // never left the deadzone - a tap, not a swipe

    if (!startCenters) {
      // Board was busy for all or part of this swipe, so there was no live
      // preview to release - resolve it as one decisive (60-degree) move
      // instead: fire it now if the board just freed up, or queue it if it's
      // still busy.
      if (rotating) queuedMove = dir;
      else move(dir, false);
      return;
    }

    rotating = true;
    const sign = dir === 'CW' ? 1 : -1;
    // Any net progress in the chosen direction commits at least the first
    // stop; a backtrack to zero cancels entirely. Past the halfway point
    // between the two stops (90 degrees), it commits the second stop instead
    // - so releasing anywhere just short of 120 still snaps forward to it,
    // and releasing well short of that (even after passing 60 on the way)
    // settles back to the 60-degree stop, not forward to 120.
    const committing = progressDeg > 0;
    const steps = progressDeg > 90 ? 2 : 1;
    if (committing) hapticTick(10);
    const targetDeg = committing ? sign * 60 * steps : 0;
    const newGrid = steps === 2 ? newGrid2 : newGrid1;
    const newTilePos = steps === 2 ? newTilePos2 : newTilePos1;
    tweenArc(startCenters, sign * progressDeg, targetDeg, DRAG_SNAP_MS, () => {
      if (committing) setTimeout(() => startFallPhase(newGrid, newTilePos), ROTATE_PAUSE_MS);
      else { rotating = false; consumeQueuedMove(); }
    });
  }
  mainEl.addEventListener('pointerup', finishDrag);
  mainEl.addEventListener('pointercancel', finishDrag);

  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('overlay-restart').addEventListener('click', startGame);
  attachFullscreenToggle(document.getElementById('fullscreen-btn'));
  attachDropdownMenu(document.getElementById('brand-btn'), document.getElementById('variant-menu'));

  startGame();
})();
</script>
</body>
</html>
