<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threes! Hex</title>
<link rel="icon" type="image/svg+xml" href="icon-hex.svg">
<link rel="apple-touch-icon" href="icon-hex.svg">
<link rel="stylesheet" href="threes-common.css">
<style>
  :root {
    --board-bg: #e8e8ea;
    --cell-bg: rgba(0,0,0,0.04);
    --cell-border: rgba(0,0,0,0.14);
  }
  #board {
    position: relative;
    background: var(--board-bg);
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  /* Pointy-top hexagon with subtly rounded corners (see the #hexRoundClip
     clipPath in the body — objectBoundingBox units so it scales with the box). */
  .hex-shape {
    clip-path: url(#hexRoundClip);
  }
  .cell-bg {
    position: absolute;
    width: 64px;
    height: 74px;
    background: var(--cell-bg);
    filter: drop-shadow(0 0 1px var(--cell-border));
  }
  /* clip-path shapes don't render `border`/`box-shadow` evenly across straight vs.
     angled edges, so both are dropped here in favor of drop-shadow, which follows
     the actual clipped silhouette and looks the same on every side. */
  .tile {
    width: 64px;
    height: 74px;
    border-radius: 0;
    font-size: 24px;
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.4)) drop-shadow(0 0 1.5px rgba(0,0,0,0.45));
  }
  .tile.wild {
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 0 6px rgba(212,175,55,0.6))
            drop-shadow(0 2px 3px rgba(0,0,0,0.25))
            drop-shadow(0 0 1px rgba(255,255,255,0.6));
  }

  #dirpad {
    display: grid;
    grid-template-columns: repeat(2, 44px);
    grid-auto-rows: 40px;
    gap: 6px;
    justify-content: center;
  }
  #dirpad button {
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.35);
    color: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #dirpad button:active { transform: scale(0.94); }
  #dirpad-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #dirpad-label {
    font-size: 12px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="hexRoundClip" clipPathUnits="objectBoundingBox">
        <path d="M0.43,0.035 Q0.5,0 0.57,0.035 L0.93,0.215 Q1,0.25 1,0.32 L1,0.68 Q1,0.75 0.93,0.785 L0.57,0.965 Q0.5,1 0.43,0.965 L0.07,0.785 Q0,0.75 0,0.68 L0,0.32 Q0,0.25 0.07,0.215 Z"/>
      </clipPath>
    </defs>
  </svg>
  <div id="app">
    <div id="header">
      <div id="brand">
        <img src="icon-hex.svg" width="40" height="40" alt="">
        <span>Threes! Hex</span>
      </div>
      <div id="next-tile-box">
        Next
        <div id="next-indicator"></div>
      </div>
      <div id="header-actions">
        <button class="icon-btn" id="fullscreen-btn" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
        <button class="game-btn" id="restart-btn">Restart</button>
      </div>
    </div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="overlay" class="hidden">
        <div id="overlay-text">Game Over</div>
        <button class="game-btn" id="overlay-restart">Try Again</button>
      </div>
    </div>
    <div id="dirpad-wrap">
      <div id="dirpad-label">Slide</div>
      <div id="dirpad">
        <button data-dir="NW">↖ NW</button>
        <button data-dir="NE">↗ NE</button>
        <button data-dir="W">← W</button>
        <button data-dir="E">E →</button>
        <button data-dir="SW">↙ SW</button>
        <button data-dir="SE">↘ SE</button>
      </div>
    </div>
    <div id="hint">Q/W/E/A/S/D or drag to slide in 6 directions &mdash; every tile can have up to 6 neighbors here, so matches come easier but the board fills up fast. Same merge rules as the classic game.</div>
    <div id="variant-nav"><a href="index.html">&larr; Back to the classic square game</a></div>
  </div>

<script src="threes-common.js"></script>
<script>
(function () {
  const {
    WILD, shuffledBag, pickRandom, cellKey, parseKey,
    currentMaxValue, randomBonusValue,
    resolveMove, isGameOver: commonIsGameOver,
    paintTile, renderNextIndicator, updatePageBackground, animateMove,
    attachDragControls, attachFullscreenToggle,
  } = ThreesCommon;

  const RADIUS = 2;
  const BASE_HEX_SIZE = 42;   // circumradius used for cell-to-cell spacing (the "pitch")
  const BASE_HEX_RENDER = 37; // circumradius actually drawn; smaller than the pitch so a
                              // gap shows on all 6 sides, matching the square grid's look
  const BASE_BOARD_PAD = 16;
  let SCALE = 1, HEX_SIZE = BASE_HEX_SIZE, HEX_RENDER = BASE_HEX_RENDER, BOARD_PAD = BASE_BOARD_PAD;
  let HEX_W = HEX_RENDER * Math.sqrt(3);
  let HEX_H = HEX_RENDER * 2;
  const SLIDE_MS = 80;
  const WINNER_FLIP_MS = 170;
  const LOSER_FLIP_MS = SLIDE_MS + 20;
  const WILDCARD_CHANCE = 0.05;
  const TRIPLE_HINT_CHANCE = 0.6;
  const BONUS_MIN_MAX = 6;
  const BONUS_CHANCE = 0.12;
  const STARTER_SIX_CHANCE = 0.15; // chance a starting tile is a 6 instead of a plain 1/2/3 draw

  const boardEl = document.getElementById('board');
  const nextIndicatorEl = document.getElementById('next-indicator');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlay-text');

  // --- Hex board geometry (axial coords q,r), precomputed once. ---
  const ALL_CELLS = [];
  for (let q = -RADIUS; q <= RADIUS; q++) {
    const r1 = Math.max(-RADIUS, -q - RADIUS), r2 = Math.min(RADIUS, -q + RADIUS);
    for (let r = r1; r <= r2; r++) ALL_CELLS.push([q, r]);
  }
  const ALL_KEYS = ALL_CELLS.map(([q, r]) => cellKey(q, r));

  // Pointy-top axial -> pixel (center of hex). Six directions come in three
  // opposite pairs (E/W, NE/SW, NW/SE); moving along one keeps a "line" of
  // cells that share the other two axes' combined coordinate constant.
  const DIRS = {
    E:  { dq: 1,  dr: 0,  groupBy: (q, r) => r,     sortBy: (q, r) => q, wallDesc: true  },
    W:  { dq: -1, dr: 0,  groupBy: (q, r) => r,     sortBy: (q, r) => q, wallDesc: false },
    NE: { dq: 1,  dr: -1, groupBy: (q, r) => q + r, sortBy: (q, r) => q, wallDesc: true  },
    SW: { dq: -1, dr: 1,  groupBy: (q, r) => q + r, sortBy: (q, r) => q, wallDesc: false },
    NW: { dq: 0,  dr: -1, groupBy: (q, r) => q,     sortBy: (q, r) => r, wallDesc: false },
    SE: { dq: 0,  dr: 1,  groupBy: (q, r) => q,     sortBy: (q, r) => r, wallDesc: true  },
  };
  // On-screen angle (degrees, atan2 convention) each direction points toward;
  // used to snap a drag gesture to the nearest of the 6 directions.
  const DIR_ANGLES = { E: 0, SE: 60, SW: 120, W: 180, NW: -120, NE: -60 };

  function buildLines(dirName) {
    const spec = DIRS[dirName];
    const groups = new Map();
    for (const [q, r] of ALL_CELLS) {
      const g = spec.groupBy(q, r);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push([q, r]);
    }
    const lines = [];
    for (const arr of groups.values()) {
      arr.sort((a, b) => spec.sortBy(a[0], a[1]) - spec.sortBy(b[0], b[1]));
      if (spec.wallDesc) arr.reverse();
      lines.push(arr.map(([q, r]) => cellKey(q, r)));
    }
    return lines;
  }
  const LINES = {};
  for (const dir of Object.keys(DIRS)) LINES[dir] = buildLines(dir);

  // Each edge counted once: only need the 3 "forward" directions from every cell.
  const NEIGHBOR_PAIRS = [];
  for (const [q, r] of ALL_CELLS) {
    for (const [dq, dr] of [[1, 0], [1, -1], [0, -1]]) {
      const nq = q + dq, nr = r + dr;
      if (Math.max(Math.abs(nq), Math.abs(nr), Math.abs(nq + nr)) <= RADIUS) {
        NEIGHBOR_PAIRS.push([cellKey(q, r), cellKey(nq, nr)]);
      }
    }
  }

  // Each cell's pixel top-left (for a HEX_W x HEX_H box), normalized so the whole
  // board sits at non-negative coordinates with BOARD_PAD margin. Recomputed
  // whenever HEX_SIZE/HEX_RENDER/BOARD_PAD change (i.e. on responsive rescale).
  let CELL_PIXEL = {};
  function layoutHex() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const centers = {};
    for (const [q, r] of ALL_CELLS) {
      const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2);
      const y = HEX_SIZE * 1.5 * r;
      centers[cellKey(q, r)] = { x, y };
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const offsetX = -minX + HEX_W / 2 + BOARD_PAD;
    const offsetY = -minY + HEX_H / 2 + BOARD_PAD;
    CELL_PIXEL = {};
    for (const key in centers) {
      CELL_PIXEL[key] = { left: centers[key].x + offsetX - HEX_W / 2, top: centers[key].y + offsetY - HEX_H / 2 };
    }
    boardEl.style.width = (maxX - minX + HEX_W + BOARD_PAD * 2) + 'px';
    boardEl.style.height = (maxY - minY + HEX_H + BOARD_PAD * 2) + 'px';
  }

  // Shrinks the whole board to fit narrow (mostly mobile) viewports instead of
  // overflowing and forcing the page to be pinch-zoomed out to see it all.
  function measureNaturalWidth() {
    let minX = Infinity, maxX = -Infinity;
    for (const [q, r] of ALL_CELLS) {
      const x = BASE_HEX_SIZE * Math.sqrt(3) * (q + r / 2);
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    }
    return (maxX - minX) + BASE_HEX_RENDER * Math.sqrt(3) + BASE_BOARD_PAD * 2;
  }
  const NATURAL_WIDTH = measureNaturalWidth();

  function computeScale() {
    const available = window.innerWidth - 44; // ~ #app's horizontal padding
    return Math.max(0.4, Math.min(1, available / NATURAL_WIDTH));
  }

  function applyBoardDimensions() {
    SCALE = computeScale();
    HEX_SIZE = BASE_HEX_SIZE * SCALE;
    HEX_RENDER = BASE_HEX_RENDER * SCALE;
    HEX_W = HEX_RENDER * Math.sqrt(3);
    HEX_H = HEX_RENDER * 2;
    BOARD_PAD = BASE_BOARD_PAD * SCALE;
    layoutHex();
  }

  function cellPos(q, r) {
    return CELL_PIXEL[cellKey(q, r)];
  }

  let grid;       // Map<"q,r", tile id>
  let tileValue;  // id -> value
  let tilePos;    // id -> [q, r]
  let elById;     // id -> DOM element
  let idCounter;
  let nextValue;
  let recordMax;  // highest tile value seen so far this game, for milestone celebrations
  let deck = [];

  function drawValue() {
    if (deck.length === 0) deck = shuffledBag();
    return deck.pop();
  }

  function drawStarterValue() {
    return Math.random() < STARTER_SIX_CHANCE ? 6 : drawValue();
  }

  function drawNextValue() {
    if (Math.random() < WILDCARD_CHANCE) return WILD;
    const maxVal = currentMaxValue(tileValue);
    if (maxVal >= BONUS_MIN_MAX && Math.random() < BONUS_CHANCE) {
      return randomBonusValue(maxVal);
    }
    return drawValue();
  }

  function emptyKeys() {
    return ALL_KEYS.filter(k => !grid.get(k));
  }

  function placeRandomTile(value) {
    const cells = emptyKeys();
    if (!cells.length) return null;
    const key = pickRandom(cells);
    const [q, r] = parseKey(key);
    const id = idCounter++;
    grid.set(key, id);
    tileValue[id] = value;
    tilePos[id] = [q, r];
    return id;
  }

  function scaleFont(el) {
    el.style.fontSize = (parseFloat(el.style.fontSize) * SCALE) + 'px';
  }

  function makeTileEl(value, q, r, spawning) {
    const el = document.createElement('div');
    el.className = 'tile hex-shape' + (spawning ? ' spawning' : '');
    paintTile(el, value);
    scaleFont(el);
    el.style.width = HEX_W + 'px';
    el.style.height = HEX_H + 'px';
    const { left, top } = cellPos(q, r);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    return el;
  }

  let cellBgEls = []; // [{el, q, r}], tracked so a resize can reposition/resize them too

  function relayoutAll() {
    for (const { el, q, r } of cellBgEls) {
      el.style.width = HEX_W + 'px';
      el.style.height = HEX_H + 'px';
      const { left, top } = cellPos(q, r);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }
    if (!elById) return;
    for (const [id, el] of elById) {
      el.style.width = HEX_W + 'px';
      el.style.height = HEX_H + 'px';
      paintTile(el, tileValue[id]);
      scaleFont(el);
      const [q, r] = tilePos[id];
      const { left, top } = cellPos(q, r);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }
  }

  function startGame() {
    grid = new Map();
    tileValue = {};
    tilePos = {};
    elById = new Map();
    idCounter = 1;
    deck = shuffledBag();

    boardEl.innerHTML = '';
    cellBgEls = [];
    for (const [q, r] of ALL_CELLS) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg hex-shape';
      bg.style.width = HEX_W + 'px';
      bg.style.height = HEX_H + 'px';
      const { left, top } = cellPos(q, r);
      bg.style.left = left + 'px';
      bg.style.top = top + 'px';
      boardEl.appendChild(bg);
      cellBgEls.push({ el: bg, q, r });
    }

    const starterIds = [];
    for (let i = 0; i < 5; i++) {
      const id = placeRandomTile(drawStarterValue());
      if (id) starterIds.push(id);
    }
    for (const id of starterIds) {
      const [q, r] = tilePos[id];
      const el = makeTileEl(tileValue[id], q, r, true);
      boardEl.appendChild(el);
      elById.set(id, el);
    }
    recordMax = currentMaxValue(tileValue); // don't celebrate reaching a value the starters already had

    nextValue = drawNextValue();
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);
    overlayEl.classList.add('hidden');
  }

  // Pure preview of what a move would do: no mutation of grid/tileValue/tilePos,
  // so it's safe to call during a drag before the player has committed to it.
  function computeMoveResult(dir) {
    if (!LINES[dir]) return { anyMoved: false };
    const { anyMoved, allMerges, newEntries } = resolveMove(grid, tileValue, LINES[dir]);
    if (!anyMoved) return { anyMoved: false };
    const newTilePos = {};
    for (const [key, id] of newEntries) if (id != null) newTilePos[id] = parseKey(key);
    const loserFinalPos = {};
    for (const { winnerId, loserId } of allMerges) loserFinalPos[loserId] = newTilePos[winnerId];
    return { anyMoved: true, allMerges, newEntries, newTilePos, loserFinalPos };
  }

  function move(dir) {
    if (!overlayEl.classList.contains('hidden')) return;

    const result = computeMoveResult(dir);
    if (!result.anyMoved) return;

    for (const { winnerId, loserId, newValue } of result.allMerges) {
      tileValue[winnerId] = newValue;
      delete tileValue[loserId];
    }
    grid = new Map(result.newEntries.filter(([, id]) => id != null));
    tilePos = result.newTilePos;

    const farEdgeKeys = LINES[dir].map(line => line[line.length - 1]).filter(k => !grid.get(k));
    const spawnCells = farEdgeKeys.length > 0 ? farEdgeKeys : emptyKeys();
    let spawnedId = null;
    let spawnEnterFrom = null;
    if (spawnCells.length > 0) {
      const key = pickRandom(spawnCells);
      const [q, r] = parseKey(key);
      const id = idCounter++;
      grid.set(key, id);
      tileValue[id] = nextValue;
      tilePos[id] = [q, r];
      spawnedId = id;
      nextValue = drawNextValue();

      // Enters from just beyond the board edge, traveling in the swipe's own
      // direction into its resting cell (one pitch step "behind" where it lands).
      const unit = unitForDir(dir);
      const finalPos = cellPos(q, r);
      const pitch = HEX_SIZE * Math.sqrt(3);
      spawnEnterFrom = { left: finalPos.left - unit.x * pitch, top: finalPos.top - unit.y * pitch };
    }

    // A merge that just set a new game-high tile gets a bigger celebratory pop.
    let milestoneIds = null;
    const newMax = currentMaxValue(tileValue);
    if (newMax > recordMax) {
      milestoneIds = new Set(result.allMerges.filter(m => m.newValue === newMax).map(m => m.winnerId));
      recordMax = newMax;
    }

    animateMove({
      elById, tileValue, tilePos, allMerges: result.allMerges, loserFinalPos: result.loserFinalPos, spawnedId,
      boardEl, cellPos, createTileEl: makeTileEl, milestoneIds, spawnEnterFrom,
      slideMs: SLIDE_MS, winnerFlipMs: WINNER_FLIP_MS, loserFlipMs: LOSER_FLIP_MS,
    });
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);

    if (commonIsGameOver(grid, tileValue, ALL_KEYS, NEIGHBOR_PAIRS)) {
      overlayTextEl.textContent = 'Game Over';
      overlayEl.classList.remove('hidden');
    }
  }

  applyBoardDimensions();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      applyBoardDimensions();
      relayoutAll();
    }, 120);
  });

  // --- Input handling: 6 directions instead of 4. ---
  const keyMap = {
    q: 'NW', e: 'NE', a: 'W', d: 'E', z: 'SW', x: 'SE',
    Q: 'NW', E: 'NE', A: 'W', D: 'E', Z: 'SW', X: 'SE',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  for (const btn of document.querySelectorAll('#dirpad button')) {
    btn.addEventListener('click', () => move(btn.dataset.dir));
  }

  function nearestHexDir(dx, dy) {
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    let best = null, bestDiff = Infinity;
    for (const [dir, target] of Object.entries(DIR_ANGLES)) {
      let diff = Math.abs(angle - target);
      if (diff > 180) diff = 360 - diff;
      if (diff < bestDiff) { bestDiff = diff; best = dir; }
    }
    return best;
  }

  function unitForDir(dir) {
    const rad = DIR_ANGLES[dir] * Math.PI / 180;
    return { x: Math.cos(rad), y: Math.sin(rad) };
  }

  attachDragControls({
    boardEl,
    isBlocked: () => !overlayEl.classList.contains('hidden'),
    pickDirection: nearestHexDir,
    pitchForDir: () => HEX_SIZE * Math.sqrt(3), // same for all 6 directions in a regular hex grid
    unitForDir,
    computeMoveResult,
    getTilePos: () => tilePos,
    getElById: () => elById,
    cellPos,
    getTileSize: () => ({ width: HEX_W, height: HEX_H }),
    overlayClass: 'hex-shape',
    commit: move,
  });

  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('overlay-restart').addEventListener('click', startGame);
  attachFullscreenToggle(document.getElementById('fullscreen-btn'));

  startGame();
})();
</script>
</body>
</html>
