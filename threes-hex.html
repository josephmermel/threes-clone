<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threes! Hex</title>
<link rel="stylesheet" href="threes-common.css">
<style>
  :root {
    --board-bg: #e8e8ea;
    --cell-bg: rgba(0,0,0,0.04);
    --cell-border: rgba(0,0,0,0.14);
  }
  #board {
    position: relative;
    background: var(--board-bg);
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  /* Pointy-top hexagon: vertex at top/bottom, flat sides at left/right. */
  .hex-shape {
    clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
  }
  .cell-bg {
    position: absolute;
    width: 73px;
    height: 84px;
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
  }
  .tile {
    width: 73px;
    height: 84px;
    border-radius: 0;
    font-size: 26px;
  }

  #dirpad {
    display: grid;
    grid-template-columns: repeat(2, 44px);
    grid-auto-rows: 40px;
    gap: 6px;
    justify-content: center;
  }
  #dirpad button {
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #dirpad button:active { transform: scale(0.94); }
  #dirpad-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #dirpad-label {
    font-size: 12px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Threes! Hex</h1>
      <div id="next-tile-box">
        Next
        <div id="next-indicator"></div>
      </div>
      <button class="game-btn" id="restart-btn">Restart</button>
    </div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="overlay" class="hidden">
        <div id="overlay-text">Game Over</div>
        <button class="game-btn" id="overlay-restart">Try Again</button>
      </div>
    </div>
    <div id="dirpad-wrap">
      <div id="dirpad-label">Slide</div>
      <div id="dirpad">
        <button data-dir="NW">↖ NW</button>
        <button data-dir="NE">↗ NE</button>
        <button data-dir="W">← W</button>
        <button data-dir="E">E →</button>
        <button data-dir="SW">↙ SW</button>
        <button data-dir="SE">↘ SE</button>
      </div>
    </div>
    <div id="hint">Q/W/E/A/S/D or drag to slide in 6 directions &mdash; every tile can have up to 6 neighbors here, so matches come easier but the board fills up fast. Same merge rules as the classic game.</div>
    <div id="variant-nav"><a href="index.html">&larr; Back to the classic square game</a></div>
  </div>

<script src="threes-common.js"></script>
<script>
(function () {
  const {
    WILD, shuffledBag, pickRandom, cellKey, parseKey,
    currentMaxValue, randomBonusValue,
    resolveMove, isGameOver: commonIsGameOver,
    paintTile, renderNextIndicator, updatePageBackground, animateMove,
  } = ThreesCommon;

  const RADIUS = 2;
  const HEX_SIZE = 42;             // circumradius in px
  const HEX_W = HEX_SIZE * Math.sqrt(3);
  const HEX_H = HEX_SIZE * 2;
  const BOARD_PAD = 16;
  const SLIDE_MS = 130;
  const WINNER_FLIP_MS = 260;
  const LOSER_FLIP_MS = SLIDE_MS + 20;
  const WILDCARD_CHANCE = 0.05;
  const TRIPLE_HINT_CHANCE = 0.6;
  const BONUS_MIN_MAX = 24;
  const BONUS_CHANCE = 0.08;

  const boardEl = document.getElementById('board');
  const nextIndicatorEl = document.getElementById('next-indicator');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlay-text');

  // --- Hex board geometry (axial coords q,r), precomputed once. ---
  const ALL_CELLS = [];
  for (let q = -RADIUS; q <= RADIUS; q++) {
    const r1 = Math.max(-RADIUS, -q - RADIUS), r2 = Math.min(RADIUS, -q + RADIUS);
    for (let r = r1; r <= r2; r++) ALL_CELLS.push([q, r]);
  }
  const ALL_KEYS = ALL_CELLS.map(([q, r]) => cellKey(q, r));

  // Pointy-top axial -> pixel (center of hex). Six directions come in three
  // opposite pairs (E/W, NE/SW, NW/SE); moving along one keeps a "line" of
  // cells that share the other two axes' combined coordinate constant.
  const DIRS = {
    E:  { dq: 1,  dr: 0,  groupBy: (q, r) => r,     sortBy: (q, r) => q, wallDesc: true  },
    W:  { dq: -1, dr: 0,  groupBy: (q, r) => r,     sortBy: (q, r) => q, wallDesc: false },
    NE: { dq: 1,  dr: -1, groupBy: (q, r) => q + r, sortBy: (q, r) => q, wallDesc: true  },
    SW: { dq: -1, dr: 1,  groupBy: (q, r) => q + r, sortBy: (q, r) => q, wallDesc: false },
    NW: { dq: 0,  dr: -1, groupBy: (q, r) => q,     sortBy: (q, r) => r, wallDesc: false },
    SE: { dq: 0,  dr: 1,  groupBy: (q, r) => q,     sortBy: (q, r) => r, wallDesc: true  },
  };
  // On-screen angle (degrees, atan2 convention) each direction points toward;
  // used to snap a drag gesture to the nearest of the 6 directions.
  const DIR_ANGLES = { E: 0, SE: 60, SW: 120, W: 180, NW: -120, NE: -60 };

  function buildLines(dirName) {
    const spec = DIRS[dirName];
    const groups = new Map();
    for (const [q, r] of ALL_CELLS) {
      const g = spec.groupBy(q, r);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push([q, r]);
    }
    const lines = [];
    for (const arr of groups.values()) {
      arr.sort((a, b) => spec.sortBy(a[0], a[1]) - spec.sortBy(b[0], b[1]));
      if (spec.wallDesc) arr.reverse();
      lines.push(arr.map(([q, r]) => cellKey(q, r)));
    }
    return lines;
  }
  const LINES = {};
  for (const dir of Object.keys(DIRS)) LINES[dir] = buildLines(dir);

  // Each edge counted once: only need the 3 "forward" directions from every cell.
  const NEIGHBOR_PAIRS = [];
  for (const [q, r] of ALL_CELLS) {
    for (const [dq, dr] of [[1, 0], [1, -1], [0, -1]]) {
      const nq = q + dq, nr = r + dr;
      if (Math.max(Math.abs(nq), Math.abs(nr), Math.abs(nq + nr)) <= RADIUS) {
        NEIGHBOR_PAIRS.push([cellKey(q, r), cellKey(nq, nr)]);
      }
    }
  }

  // Precompute each cell's pixel top-left (for a HEX_W x HEX_H box), normalized
  // so the whole board sits at non-negative coordinates with BOARD_PAD margin.
  const CELL_PIXEL = {};
  {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const centers = {};
    for (const [q, r] of ALL_CELLS) {
      const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2);
      const y = HEX_SIZE * 1.5 * r;
      centers[cellKey(q, r)] = { x, y };
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    const offsetX = -minX + HEX_W / 2 + BOARD_PAD;
    const offsetY = -minY + HEX_H / 2 + BOARD_PAD;
    for (const key in centers) {
      CELL_PIXEL[key] = { left: centers[key].x + offsetX - HEX_W / 2, top: centers[key].y + offsetY - HEX_H / 2 };
    }
    boardEl.style.width = (maxX - minX + HEX_W + BOARD_PAD * 2) + 'px';
    boardEl.style.height = (maxY - minY + HEX_H + BOARD_PAD * 2) + 'px';
  }

  function cellPos(q, r) {
    return CELL_PIXEL[cellKey(q, r)];
  }

  let grid;       // Map<"q,r", tile id>
  let tileValue;  // id -> value
  let tilePos;    // id -> [q, r]
  let elById;     // id -> DOM element
  let idCounter;
  let nextValue;
  let deck = [];

  function drawValue() {
    if (deck.length === 0) deck = shuffledBag();
    return deck.pop();
  }

  function drawNextValue() {
    if (Math.random() < WILDCARD_CHANCE) return WILD;
    const maxVal = currentMaxValue(tileValue);
    if (maxVal >= BONUS_MIN_MAX && Math.random() < BONUS_CHANCE) {
      return randomBonusValue(maxVal);
    }
    return drawValue();
  }

  function emptyKeys() {
    return ALL_KEYS.filter(k => !grid.get(k));
  }

  function placeRandomTile(value) {
    const cells = emptyKeys();
    if (!cells.length) return null;
    const key = pickRandom(cells);
    const [q, r] = parseKey(key);
    const id = idCounter++;
    grid.set(key, id);
    tileValue[id] = value;
    tilePos[id] = [q, r];
    return id;
  }

  function makeTileEl(value, q, r, spawning) {
    const el = document.createElement('div');
    el.className = 'tile hex-shape' + (spawning ? ' spawning' : '');
    paintTile(el, value);
    const { left, top } = cellPos(q, r);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    return el;
  }

  function startGame() {
    grid = new Map();
    tileValue = {};
    tilePos = {};
    elById = new Map();
    idCounter = 1;
    deck = shuffledBag();

    boardEl.innerHTML = '';
    for (const [q, r] of ALL_CELLS) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg hex-shape';
      const { left, top } = cellPos(q, r);
      bg.style.left = left + 'px';
      bg.style.top = top + 'px';
      boardEl.appendChild(bg);
    }

    const starterIds = [];
    for (let i = 0; i < 5; i++) {
      const id = placeRandomTile(drawValue());
      if (id) starterIds.push(id);
    }
    for (const id of starterIds) {
      const [q, r] = tilePos[id];
      const el = makeTileEl(tileValue[id], q, r, true);
      boardEl.appendChild(el);
      elById.set(id, el);
    }

    nextValue = drawNextValue();
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);
    overlayEl.classList.add('hidden');
  }

  function move(dir) {
    if (!overlayEl.classList.contains('hidden')) return;
    if (!LINES[dir]) return;

    const { anyMoved, allMerges, newEntries } = resolveMove(grid, tileValue, LINES[dir]);
    if (!anyMoved) return;

    for (const { winnerId, loserId, newValue } of allMerges) {
      tileValue[winnerId] = newValue;
      delete tileValue[loserId];
    }

    grid = new Map(newEntries.filter(([, id]) => id != null));
    tilePos = {};
    for (const [key, id] of newEntries) if (id != null) tilePos[id] = parseKey(key);

    const loserFinalPos = {};
    for (const { winnerId, loserId } of allMerges) {
      loserFinalPos[loserId] = tilePos[winnerId];
    }

    const farEdgeKeys = LINES[dir].map(line => line[line.length - 1]).filter(k => !grid.get(k));
    const spawnCells = farEdgeKeys.length > 0 ? farEdgeKeys : emptyKeys();
    let spawnedId = null;
    if (spawnCells.length > 0) {
      const key = pickRandom(spawnCells);
      const [q, r] = parseKey(key);
      const id = idCounter++;
      grid.set(key, id);
      tileValue[id] = nextValue;
      tilePos[id] = [q, r];
      spawnedId = id;
      nextValue = drawNextValue();
    }

    animateMove({
      elById, tileValue, tilePos, allMerges, loserFinalPos, spawnedId,
      boardEl, cellPos, createTileEl: makeTileEl,
      slideMs: SLIDE_MS, winnerFlipMs: WINNER_FLIP_MS, loserFlipMs: LOSER_FLIP_MS,
    });
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);

    if (commonIsGameOver(grid, tileValue, ALL_KEYS, NEIGHBOR_PAIRS)) {
      overlayTextEl.textContent = 'Game Over';
      overlayEl.classList.remove('hidden');
    }
  }

  // --- Input handling: 6 directions instead of 4. ---
  const keyMap = {
    q: 'NW', e: 'NE', a: 'W', d: 'E', z: 'SW', x: 'SE',
    Q: 'NW', E: 'NE', A: 'W', D: 'E', Z: 'SW', X: 'SE',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  for (const btn of document.querySelectorAll('#dirpad button')) {
    btn.addEventListener('click', () => move(btn.dataset.dir));
  }

  function nearestHexDir(dx, dy) {
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    let best = null, bestDiff = Infinity;
    for (const [dir, target] of Object.entries(DIR_ANGLES)) {
      let diff = Math.abs(angle - target);
      if (diff > 180) diff = 360 - diff;
      if (diff < bestDiff) { bestDiff = diff; best = dir; }
    }
    return best;
  }

  let dragStart = null;
  boardEl.addEventListener('pointerdown', (e) => {
    dragStart = { x: e.clientX, y: e.clientY };
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    dragStart = null;
    if (Math.hypot(dx, dy) < 24) return;
    move(nearestHexDir(dx, dy));
  });

  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('overlay-restart').addEventListener('click', startGame);

  startGame();
})();
</script>
</body>
</html>
