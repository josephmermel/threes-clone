<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threes! Clone</title>
<link rel="stylesheet" href="threes-common.css">
<style>
  :root {
    --board-bg: #e8e8ea;
    --cell-bg: rgba(0,0,0,0.04);
    --cell-border: rgba(0,0,0,0.14);
  }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 90px);
    grid-template-rows: repeat(4, 90px);
    gap: 12px;
    background: var(--board-bg);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  .cell-bg {
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 8px;
  }
  .tile {
    width: 90px;
    height: 90px;
    border-radius: 8px;
    font-size: 30px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Threes!</h1>
      <div id="next-tile-box">
        Next
        <div id="next-indicator"></div>
      </div>
      <button class="game-btn" id="restart-btn">Restart</button>
    </div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="overlay" class="hidden">
        <div id="overlay-text">Game Over</div>
        <button class="game-btn" id="overlay-restart">Try Again</button>
      </div>
    </div>
    <div id="hint">Arrow keys / swipe / drag to slide tiles. 1 + 2 = 3, matching tiles combine (3+3=6, 6+6=12, ...). The rare gold-and-purple ★ wildcard matches whatever it slides into. Bonus tiles sometimes show as a group of three &mdash; the real one could be any of them.</div>
    <div id="variant-nav"><a href="threes-hex.html">Try the hex variant &rarr;</a></div>
  </div>

<script src="threes-common.js"></script>
<script>
(function () {
  const {
    WILD, shuffledBag, pickRandom, cellKey, parseKey,
    currentMaxValue, randomBonusValue,
    resolveMove, isGameOver: commonIsGameOver,
    paintTile, renderNextIndicator, updatePageBackground, animateMove,
  } = ThreesCommon;

  const SIZE = 4;
  const CELL = 90;
  const GAP = 12;
  const SLIDE_MS = 130;
  const WINNER_FLIP_MS = 260;
  const LOSER_FLIP_MS = SLIDE_MS + 20;
  const WILDCARD_CHANCE = 0.06;
  const TRIPLE_HINT_CHANCE = 0.6; // for values > 3, how often to show an ambiguous triple instead of the exact value
  const BONUS_MIN_MAX = 24;  // board needs at least this large a tile before bonus tiles can spawn
  const BONUS_CHANCE = 0.08; // chance the next tile is a bonus (>3) tile once eligible

  const boardEl = document.getElementById('board');
  const nextIndicatorEl = document.getElementById('next-indicator');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlay-text');

  // --- Board geometry: a plain 4x4 grid, keyed "row,col". Precomputed once. ---
  const ALL_KEYS = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) ALL_KEYS.push(cellKey(r, c));

  // pos 0 = wall/leading edge in the swipe direction, pos (SIZE-1) = far edge.
  function coordsFor(dir, lineIdx, pos) {
    switch (dir) {
      case 'left':  return [lineIdx, pos];
      case 'right': return [lineIdx, SIZE - 1 - pos];
      case 'up':    return [pos, lineIdx];
      case 'down':  return [SIZE - 1 - pos, lineIdx];
    }
  }
  const LINES = {};
  for (const dir of ['left', 'right', 'up', 'down']) {
    LINES[dir] = [];
    for (let lineIdx = 0; lineIdx < SIZE; lineIdx++) {
      const line = [];
      for (let pos = 0; pos < SIZE; pos++) {
        const [r, c] = coordsFor(dir, lineIdx, pos);
        line.push(cellKey(r, c));
      }
      LINES[dir].push(line);
    }
  }
  const NEIGHBOR_PAIRS = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (c < SIZE - 1) NEIGHBOR_PAIRS.push([cellKey(r, c), cellKey(r, c + 1)]);
      if (r < SIZE - 1) NEIGHBOR_PAIRS.push([cellKey(r, c), cellKey(r + 1, c)]);
    }
  }

  let grid;       // Map<"r,c", tile id>
  let tileValue;  // id -> value
  let tilePos;    // id -> [r, c]
  let elById;     // id -> DOM element
  let idCounter;
  let nextValue;
  let deck = [];

  function drawValue() {
    if (deck.length === 0) deck = shuffledBag();
    return deck.pop();
  }

  // Occasionally a wildcard, occasionally a rare bonus tile (>3) once the board has
  // grown enough, otherwise a normal 1/2/3 draw.
  function drawNextValue() {
    if (Math.random() < WILDCARD_CHANCE) return WILD;
    const maxVal = currentMaxValue(tileValue);
    if (maxVal >= BONUS_MIN_MAX && Math.random() < BONUS_CHANCE) {
      return randomBonusValue(maxVal);
    }
    return drawValue();
  }

  function cellPos(r, c) {
    return { left: c * (CELL + GAP) + GAP, top: r * (CELL + GAP) + GAP };
  }

  function emptyKeys() {
    return ALL_KEYS.filter(k => !grid.get(k));
  }

  function placeRandomTile(value) {
    const cells = emptyKeys();
    if (!cells.length) return null;
    const key = pickRandom(cells);
    const [r, c] = parseKey(key);
    const id = idCounter++;
    grid.set(key, id);
    tileValue[id] = value;
    tilePos[id] = [r, c];
    return id;
  }

  function makeTileEl(value, r, c, spawning) {
    const el = document.createElement('div');
    el.className = 'tile' + (spawning ? ' spawning' : '');
    paintTile(el, value);
    const { left, top } = cellPos(r, c);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    return el;
  }

  function startGame() {
    grid = new Map();
    tileValue = {};
    tilePos = {};
    elById = new Map();
    idCounter = 1;
    deck = shuffledBag();

    boardEl.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      boardEl.appendChild(bg);
    }

    const starterIds = [];
    for (let i = 0; i < 5; i++) {
      const id = placeRandomTile(drawValue());
      if (id) starterIds.push(id);
    }
    for (const id of starterIds) {
      const [r, c] = tilePos[id];
      const el = makeTileEl(tileValue[id], r, c, true);
      boardEl.appendChild(el);
      elById.set(id, el);
    }

    nextValue = drawNextValue();
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);
    overlayEl.classList.add('hidden');
  }

  function move(dir) {
    if (!overlayEl.classList.contains('hidden')) return;

    const { anyMoved, allMerges, newEntries } = resolveMove(grid, tileValue, LINES[dir]);
    if (!anyMoved) return;

    for (const { winnerId, loserId, newValue } of allMerges) {
      tileValue[winnerId] = newValue;
      delete tileValue[loserId];
    }

    grid = new Map(newEntries.filter(([, id]) => id != null));
    tilePos = {};
    for (const [key, id] of newEntries) if (id != null) tilePos[id] = parseKey(key);

    const loserFinalPos = {};
    for (const { winnerId, loserId } of allMerges) {
      loserFinalPos[loserId] = tilePos[winnerId];
    }

    const farEdgeKeys = LINES[dir].map(line => line[line.length - 1]).filter(k => !grid.get(k));
    const spawnCells = farEdgeKeys.length > 0 ? farEdgeKeys : emptyKeys();
    let spawnedId = null;
    if (spawnCells.length > 0) {
      const key = pickRandom(spawnCells);
      const [r, c] = parseKey(key);
      const id = idCounter++;
      grid.set(key, id);
      tileValue[id] = nextValue;
      tilePos[id] = [r, c];
      spawnedId = id;
      nextValue = drawNextValue();
    }

    animateMove({
      elById, tileValue, tilePos, allMerges, loserFinalPos, spawnedId,
      boardEl, cellPos, createTileEl: makeTileEl,
      slideMs: SLIDE_MS, winnerFlipMs: WINNER_FLIP_MS, loserFlipMs: LOSER_FLIP_MS,
    });
    renderNextIndicator(nextIndicatorEl, nextValue, TRIPLE_HINT_CHANCE);
    updatePageBackground(tileValue);

    if (commonIsGameOver(grid, tileValue, ALL_KEYS, NEIGHBOR_PAIRS)) {
      overlayTextEl.textContent = 'Game Over';
      overlayEl.classList.remove('hidden');
    }
  }

  boardEl.style.width = (SIZE * CELL + (SIZE + 1) * GAP) + 'px';
  boardEl.style.height = (SIZE * CELL + (SIZE + 1) * GAP) + 'px';

  // --- Input handling ---
  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  let dragStart = null;
  boardEl.addEventListener('pointerdown', (e) => {
    dragStart = { x: e.clientX, y: e.clientY };
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    dragStart = null;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 24) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('overlay-restart').addEventListener('click', startGame);

  startGame();
})();
</script>
</body>
</html>
