<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threes! Clone</title>
<style>
  :root {
    --board-bg: #e8e8ea;
    --cell-bg: rgba(0,0,0,0.04);
    --cell-border: rgba(0,0,0,0.14);
    --page-bg: #23262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--page-bg);
    transition: background-color 0.6s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #f4f1e9;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
  }
  #header {
    display: flex;
    align-items: center;
    gap: 24px;
    width: 100%;
    justify-content: space-between;
  }
  h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 1px;
  }
  #next-tile-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.9;
  }
  #next-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tile.preview {
    position: static !important;
    width: 46px;
    height: 46px;
    font-size: 18px;
  }
  .tile.preview.mini {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }
  button.game-btn {
    background: #f4a340;
    border: none;
    color: #2f4858;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button.game-btn:active { transform: scale(0.96); }

  #board-wrap {
    position: relative;
  }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 90px);
    grid-template-rows: repeat(4, 90px);
    gap: 12px;
    background: var(--board-bg);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.16);
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  }
  .cell-bg {
    background: var(--cell-bg);
    border: 1px solid var(--cell-border);
    border-radius: 8px;
  }
  .tile {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    box-shadow: 0 3px 6px rgba(0,0,0,0.22);
    border: 1px solid rgba(0,0,0,0.12);
    z-index: 1;
    transition: left 0.13s cubic-bezier(.32,.72,.35,1),
                top 0.13s cubic-bezier(.32,.72,.35,1),
                opacity 0.13s ease,
                transform 0.13s ease;
  }
  @keyframes spawnFade {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  .tile.spawning { animation: spawnFade 0.3s ease-out; }

  @keyframes mergePop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .tile.merging { animation: mergePop 0.2s ease-out; z-index: 2; }

  .tile.wild {
    background: linear-gradient(135deg, #7b2fbf, #d4af37 45%, #7b2fbf 90%);
    background-size: 240% 240%;
    box-shadow: 0 0 12px 2px rgba(212,175,55,0.6), 0 3px 6px rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.5);
  }
  @keyframes wildShimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .tile.wild:not(.spawning):not(.merging):not(.wild-winner-flip):not(.wild-loser-flip) {
    animation: wildShimmer 2.6s ease-in-out infinite;
  }

  /* Wildcard reveals the number it's matching as it lands, mid-flip. */
  @keyframes wildWinnerFlip {
    0%   { transform: rotateY(0deg) scale(1); }
    45%  { transform: rotateY(90deg) scale(1); }
    55%  { transform: rotateY(90deg) scale(1); }
    75%  { transform: rotateY(0deg) scale(1.2); }
    100% { transform: rotateY(0deg) scale(1); }
  }
  .tile.wild-winner-flip { animation: wildWinnerFlip 0.26s ease-out; z-index: 2; }

  /* Wildcard reveals its matched number mid-slide, then merges away. */
  @keyframes wildLoserFlip {
    0%   { transform: rotateY(0deg) scale(1); opacity: 1; }
    40%  { transform: rotateY(90deg) scale(1); opacity: 1; }
    60%  { transform: rotateY(90deg) scale(1); opacity: 1; }
    100% { transform: rotateY(0deg) scale(0.4); opacity: 0; }
  }
  .tile.wild-loser-flip { animation: wildLoserFlip 0.15s ease-in; z-index: 1; }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 30, 38, 0.88);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 700;
    z-index: 10;
  }
  #overlay.hidden { display: none; }

  #hint {
    font-size: 13px;
    opacity: 0.7;
    text-align: center;
    max-width: 380px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Threes!</h1>
      <div id="next-tile-box">
        Next
        <div id="next-indicator"></div>
      </div>
      <button class="game-btn" id="restart-btn">Restart</button>
    </div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="overlay" class="hidden">
        <div id="overlay-text">Game Over</div>
        <button class="game-btn" id="overlay-restart">Try Again</button>
      </div>
    </div>
    <div id="hint">Arrow keys / swipe / drag to slide tiles. 1 + 2 = 3, matching tiles combine (3+3=6, 6+6=12, ...). The rare gold-and-purple ★ wildcard matches whatever it slides into. Bonus tiles sometimes show as a group of three &mdash; the real one could be any of them.</div>
  </div>

<script>
(function () {
  const SIZE = 4;
  const CELL = 90;
  const GAP = 12;
  const SLIDE_MS = 130;
  const WINNER_FLIP_MS = 260;
  const LOSER_FLIP_MS = SLIDE_MS + 20;
  const WILD = 'W';
  const WILDCARD_CHANCE = 0.06;
  const TRIPLE_HINT_CHANCE = 0.6; // for values > 3, how often to show an ambiguous triple instead of the exact value
  const BONUS_MIN_MAX = 24;  // board needs at least this large a tile before bonus tiles can spawn
  const BONUS_CHANCE = 0.08; // chance the next tile is a bonus (>3) tile once eligible

  const boardEl = document.getElementById('board');
  const nextIndicatorEl = document.getElementById('next-indicator');
  const overlayEl = document.getElementById('overlay');
  const overlayTextEl = document.getElementById('overlay-text');

  let grid;          // grid[r][c] = tile id or null
  let tileValue;      // id -> value
  let tileRC;         // id -> [r, c]
  let elById;         // id -> DOM element
  let idCounter;
  let nextValue;
  let deck = [];

  function shuffledBag() {
    const bag = [1, 1, 2, 2, 3];
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag;
  }

  function drawValue() {
    if (deck.length === 0) deck = shuffledBag();
    return deck.pop();
  }

  function currentMaxValue() {
    let max = 3;
    for (const id in tileValue) {
      const v = tileValue[id];
      if (v !== WILD && v > max) max = v;
    }
    return max;
  }

  // A random tile from the doubling chain 6,12,24,..., capped at half the board's largest tile.
  function randomBonusValue(maxVal) {
    const cap = Math.max(6, Math.floor(maxVal / 2));
    const chain = [];
    for (let v = 6; v <= cap; v *= 2) chain.push(v);
    return pickRandom(chain);
  }

  // Value used for the *next* tile: occasionally a wildcard, occasionally a rare
  // bonus tile (>3) once the board has grown enough, otherwise a normal 1/2/3 draw.
  function drawNextValue() {
    if (Math.random() < WILDCARD_CHANCE) return WILD;
    const maxVal = currentMaxValue();
    if (maxVal >= BONUS_MIN_MAX && Math.random() < BONUS_CHANCE) {
      return randomBonusValue(maxVal);
    }
    return drawValue();
  }

  function canMerge(a, b) {
    if (a === 0 || b === 0) return false;
    if (a === WILD || b === WILD) return !(a === WILD && b === WILD);
    if ((a === 1 && b === 2) || (a === 2 && b === 1)) return true;
    return a === b && a >= 3;
  }

  // The value that would ordinarily merge with x (its own value for x>=3, its 1/2 counterpart otherwise).
  function partnerValue(x) {
    if (x === 1) return 2;
    if (x === 2) return 1;
    return x;
  }

  // Resulting value when a and b merge; a wildcard acts as whatever value completes the match.
  function mergeValue(a, b) {
    if (a === WILD) return b + partnerValue(b);
    if (b === WILD) return a + partnerValue(a);
    return a + b;
  }

  // Static, overlapping triples along the doubling chain 6,12,24,48,96,... :
  // [6,12,24], [24,48,96], [96,192,384], ... each spanning a factor of 4,
  // consecutive triples sharing their boundary value. Returns every triple
  // (as [lo, mid, hi]) that contains v; junction values belong to two.
  function triplesContaining(v) {
    const n = Math.round(Math.log2(v / 3)); // v === 3 * 2^n
    const results = [];
    if (n % 2 === 1) results.push([v, v * 2, v * 4]);      // v is the low end of a triple
    if (n % 2 === 0) results.push([v / 2, v, v * 2]);      // v is the middle of a triple
    if (n % 2 === 1 && n >= 3) results.push([v / 4, v / 2, v]); // v is the high end of a triple
    return results;
  }

  // pos 0 = wall/leading edge in the swipe direction, pos 3 = far edge.
  function coordsFor(dir, lineIdx, pos) {
    switch (dir) {
      case 'left':  return [lineIdx, pos];
      case 'right': return [lineIdx, 3 - pos];
      case 'up':    return [pos, lineIdx];
      case 'down':  return [3 - pos, lineIdx];
    }
  }

  function cellPos(r, c) {
    return { left: c * (CELL + GAP) + GAP, top: r * (CELL + GAP) + GAP };
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) cells.push([r, c]);
    return cells;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function placeRandomTile(value) {
    const cells = emptyCells();
    if (!cells.length) return null;
    const [r, c] = pickRandom(cells);
    const id = idCounter++;
    grid[r][c] = id;
    tileValue[id] = value;
    tileRC[id] = [r, c];
    return id;
  }

  // Collapses one line (array of {id,value}|null, index0 = wall side) in place.
  // Returns { moved, merges: [{winnerId, loserId, newValue}] }.
  function collapseLineWithIds(line) {
    let moved = false;
    const merges = [];
    for (let i = 0; i < SIZE - 1; i++) {
      const a = line[i], b = line[i + 1];
      if (!a && b) {
        line[i] = b; line[i + 1] = null; moved = true;
      } else if (a && b && canMerge(a.value, b.value)) {
        const newValue = mergeValue(a.value, b.value);
        const winnerWasWild = a.value === WILD;
        const loserWasWild = b.value === WILD;
        // The number the wildcard stood in for, so its flip can reveal it.
        const revealValue = winnerWasWild ? partnerValue(b.value)
                           : loserWasWild ? partnerValue(a.value)
                           : null;
        merges.push({ winnerId: a.id, loserId: b.id, newValue, winnerWasWild, loserWasWild, revealValue });
        line[i] = { id: a.id, value: newValue };
        line[i + 1] = null;
        moved = true;
      }
    }
    return { moved, merges };
  }

  // Hues for 3, 6, 12, 24, ..., 12288 (rank = log2(v/3)). Spaced unevenly on purpose:
  // much wider gaps through the yellow/green band (where hue differences are hardest
  // to tell apart) so consecutive tiles read as distinct colors, not shades of one color.
  const RAINBOW_HUES = [0, 25, 60, 105, 150, 175, 195, 210, 225, 240, 252, 262, 270];

  function hueForValue(v) {
    const rank = Math.min(Math.round(Math.log2(v / 3)), RAINBOW_HUES.length - 1);
    return RAINBOW_HUES[rank];
  }

  function tileColor(v) {
    if (v === 1) return { bg: '#ffffff', fg: '#3a3a3a' };
    if (v === 2) return { bg: '#232323', fg: '#f2f2f2' };
    const hue = hueForValue(v);
    const bg = `hsl(${hue}, 68%, 55%)`;
    // The gold/chartreuse band reads as light even at a fixed lightness, so flip to dark text there.
    const fg = (hue >= 40 && hue <= 120) ? '#2b2410' : '#fff8ec';
    return { bg, fg };
  }

  // The page background follows the highest tile on the board: that tile's own color
  // laid over white at 50% opacity, so it stays a clear, colorful hue rather than a
  // dark muddy one, and shifts every time a new high tile appears.
  function updatePageBackground() {
    let maxVal = 1;
    for (const id in tileValue) {
      const v = tileValue[id];
      if (v !== WILD && v > maxVal) maxVal = v;
    }
    const { bg: tileBg } = tileColor(maxVal);
    const bg = `color-mix(in srgb, ${tileBg} 50%, white)`;
    document.documentElement.style.setProperty('--page-bg', bg);
  }

  // Paints a normal numbered face, even mid-flip on a tile whose real value is still WILD.
  function paintNumeral(el, value) {
    el.classList.remove('wild');
    const { bg, fg } = tileColor(value);
    el.style.background = bg;
    el.style.color = fg;
    el.style.fontSize = value >= 100 ? '24px' : (value >= 1000 ? '20px' : '30px');
    el.textContent = value;
  }

  function paintTile(el, value) {
    if (value === WILD) {
      el.style.background = '';
      el.style.color = '#fff8ec';
      el.style.fontSize = '32px';
      el.textContent = '★';
      el.classList.add('wild');
      return;
    }
    paintNumeral(el, value);
  }

  function makeTileEl(value, r, c, spawning) {
    const el = document.createElement('div');
    el.className = 'tile' + (spawning ? ' spawning' : '');
    paintTile(el, value);
    const { left, top } = cellPos(r, c);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    return el;
  }

  function startGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    tileValue = {};
    tileRC = {};
    elById = new Map();
    idCounter = 1;
    deck = shuffledBag();

    boardEl.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      boardEl.appendChild(bg);
    }

    const starterIds = [];
    for (let i = 0; i < 5; i++) {
      const id = placeRandomTile(drawValue());
      if (id) starterIds.push(id);
    }
    for (const id of starterIds) {
      const [r, c] = tileRC[id];
      const el = makeTileEl(tileValue[id], r, c, true);
      boardEl.appendChild(el);
      elById.set(id, el);
    }

    nextValue = drawNextValue();
    updateNextPreview();
    updatePageBackground();
    overlayEl.classList.add('hidden');
  }

  function miniFontSize(value) {
    const len = String(value).length;
    if (len <= 1) return '15px';
    if (len === 2) return '14px';
    if (len === 3) return '12px';
    return '10px';
  }

  function makePreviewTile(value, mini) {
    const el = document.createElement('div');
    el.className = 'tile preview' + (mini ? ' mini' : '');
    paintTile(el, value);
    if (mini) el.style.fontSize = miniFontSize(value);
    return el;
  }

  // 1/2/3 (and the wildcard) always show plainly. Values > 3 show plainly 40% of
  // the time and otherwise show one of the static triples containing that value,
  // so the true value shows up in a random slot instead of being given away.
  function updateNextPreview() {
    nextIndicatorEl.innerHTML = '';
    let showTriple = false;
    let triple = null;
    if (nextValue !== WILD && nextValue > 3 && Math.random() < TRIPLE_HINT_CHANCE) {
      const candidates = triplesContaining(nextValue);
      triple = pickRandom(candidates);
      showTriple = true;
    }
    if (showTriple) {
      for (const v of triple) nextIndicatorEl.appendChild(makePreviewTile(v, true));
    } else {
      nextIndicatorEl.appendChild(makePreviewTile(nextValue, false));
    }
  }

  function move(dir) {
    if (!overlayEl.classList.contains('hidden')) return;

    const beforeRC = {};
    for (const id in tileRC) beforeRC[id] = tileRC[id].slice();

    let anyMoved = false;
    const allMerges = [];
    const newGrid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

    for (let lineIdx = 0; lineIdx < SIZE; lineIdx++) {
      const slots = [];
      for (let pos = 0; pos < SIZE; pos++) {
        const [r, c] = coordsFor(dir, lineIdx, pos);
        const id = grid[r][c];
        slots.push(id ? { id, value: tileValue[id] } : null);
      }
      const { moved, merges } = collapseLineWithIds(slots);
      if (moved) anyMoved = true;
      allMerges.push(...merges);
      for (let pos = 0; pos < SIZE; pos++) {
        const [r, c] = coordsFor(dir, lineIdx, pos);
        newGrid[r][c] = slots[pos] ? slots[pos].id : null;
      }
    }

    if (!anyMoved) return;

    for (const { winnerId, loserId, newValue } of allMerges) {
      tileValue[winnerId] = newValue;
      delete tileValue[loserId];
    }

    grid = newGrid;
    tileRC = {};
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) tileRC[grid[r][c]] = [r, c];

    const loserFinalPos = {};
    for (const { winnerId, loserId } of allMerges) {
      loserFinalPos[loserId] = tileRC[winnerId];
    }

    const farEdgeCells = [];
    for (let lineIdx = 0; lineIdx < SIZE; lineIdx++) {
      const [r, c] = coordsFor(dir, lineIdx, 3);
      if (!grid[r][c]) farEdgeCells.push([r, c]);
    }
    const spawnCells = farEdgeCells.length > 0 ? farEdgeCells : emptyCells();
    let spawnedId = null;
    if (spawnCells.length > 0) {
      const [r, c] = pickRandom(spawnCells);
      const id = idCounter++;
      grid[r][c] = id;
      tileValue[id] = nextValue;
      tileRC[id] = [r, c];
      spawnedId = id;
      nextValue = drawNextValue();
    }

    animateMove({ allMerges, loserFinalPos, spawnedId });
    updateNextPreview();
    updatePageBackground();

    if (isGameOver()) {
      overlayTextEl.textContent = 'Game Over';
      overlayEl.classList.remove('hidden');
    }
  }

  function animateMove({ allMerges, loserFinalPos, spawnedId }) {
    const winnerMeta = new Map(allMerges.map(m => [m.winnerId, m]));

    // Losers slide into the winner's final spot, then fade out.
    for (const m of allMerges) {
      const { loserId, loserWasWild, revealValue } = m;
      const el = elById.get(loserId);
      if (!el) continue;
      const [r, c] = loserFinalPos[loserId];
      const { left, top } = cellPos(r, c);
      el.style.zIndex = '1';
      el.style.left = left + 'px';
      el.style.top = top + 'px';

      if (loserWasWild) {
        // Reveal the number it's matching as, mid-slide, then flip-fade away.
        el.classList.add('wild-loser-flip');
        setTimeout(() => paintNumeral(el, revealValue), Math.round(LOSER_FLIP_MS * 0.5));
      } else {
        el.style.opacity = '0';
        el.style.transform = 'scale(0.4)';
      }
      setTimeout(() => {
        el.remove();
        elById.delete(loserId);
      }, LOSER_FLIP_MS);
    }

    // Survivors (including merge winners) glide to their new cell.
    for (const idStr in tileRC) {
      const id = Number(idStr);
      if (id === spawnedId) continue;
      const el = elById.get(id);
      if (!el) continue;
      const [r, c] = tileRC[id];
      const { left, top } = cellPos(r, c);
      el.style.left = left + 'px';
      el.style.top = top + 'px';

      const meta = winnerMeta.get(id);
      if (meta && meta.winnerWasWild) {
        // Card-flip from wildcard to the resulting number as the merge lands.
        setTimeout(() => {
          el.classList.remove('merging');
          el.classList.add('wild-winner-flip');
          setTimeout(() => paintTile(el, meta.newValue), Math.round(WINNER_FLIP_MS * 0.5));
          setTimeout(() => el.classList.remove('wild-winner-flip'), WINNER_FLIP_MS);
        }, SLIDE_MS);
      } else if (meta) {
        const value = tileValue[id];
        setTimeout(() => {
          paintTile(el, value);
          el.classList.remove('merging');
          void el.offsetWidth;
          el.classList.add('merging');
        }, SLIDE_MS);
      }
    }

    // New tile pops in at its resting cell.
    if (spawnedId != null) {
      const [r, c] = tileRC[spawnedId];
      const el = makeTileEl(tileValue[spawnedId], r, c, true);
      boardEl.appendChild(el);
      elById.set(spawnedId, el);
    }
  }

  function isGameOver() {
    if (emptyCells().length > 0) return false;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const id = grid[r][c];
        const v = tileValue[id];
        if (c < SIZE - 1) {
          const rid = grid[r][c + 1];
          if (rid && canMerge(v, tileValue[rid])) return false;
        }
        if (r < SIZE - 1) {
          const did = grid[r + 1][c];
          if (did && canMerge(v, tileValue[did])) return false;
        }
      }
    }
    return true;
  }

  boardEl.style.width = (SIZE * CELL + (SIZE + 1) * GAP) + 'px';
  boardEl.style.height = (SIZE * CELL + (SIZE + 1) * GAP) + 'px';

  // --- Input handling ---
  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  let dragStart = null;
  boardEl.addEventListener('pointerdown', (e) => {
    dragStart = { x: e.clientX, y: e.clientY };
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    dragStart = null;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 24) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('overlay-restart').addEventListener('click', startGame);

  startGame();
})();
</script>
</body>
</html>
